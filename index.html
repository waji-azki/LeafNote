<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リーフノート</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EFECE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1B17" media="(prefers-color-scheme: dark)">
<meta name="description" content="手書きのお仕事メモを、ミニルーズリーフに印刷できるかたちにまとめるアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="リーフノート">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<style id="pagestyle"></style>
<style>
  :root{
    --paper:#EFECE2; --surface:#FFFFFF; --surface-2:#F7F5EC;
    --ink:#26251F; --ink-soft:#6B6A5F;
    --accent:#2E4A73; --accent-contrast:#FFFFFF; --accent-soft:#DCE4EE;
    --rule:#A63D33; --line:#D9D5C6; --danger:#A63D33;
    --shadow:0 1px 3px rgba(38,37,31,.10), 0 1px 2px rgba(38,37,31,.06);
    --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif;
    --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1B17; --surface:#24231D; --surface-2:#2B2A23;
      --ink:#ECE8DC; --ink-soft:#A9A597;
      --accent:#8FB0D9; --accent-contrast:#14202E; --accent-soft:#2A3A4C;
      --rule:#D97B6D; --line:#3B392F; --danger:#D97B6D;
      --shadow:0 1px 3px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1B17; --surface:#24231D; --surface-2:#2B2A23;
    --ink:#ECE8DC; --ink-soft:#A9A597;
    --accent:#8FB0D9; --accent-contrast:#14202E; --accent-soft:#2A3A4C;
    --rule:#D97B6D; --line:#3B392F; --danger:#D97B6D;
    --shadow:0 1px 3px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  /* overscroll-behavior は html に書かないとブラウザの「引っ張って更新」に効かない。
     ボックスを作る下フリックが更新と誤判定されるのを止めるため、両方に指定する。 */
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6; -webkit-tap-highlight-color:transparent;}
  /* フロー編集中はページ自体を動かさない(引っ張って更新の入口をふさぐ) */
  body.canvasLock{position:fixed; inset:0; width:100%; overflow:hidden;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none!important;}
  img{max-width:100%;}

  #app{height:100%; display:flex; flex-direction:column; max-width:640px; margin:0 auto; position:relative;}
  .topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:6; display:flex; align-items:center; gap:10px; padding:14px 16px 12px; background:var(--paper); border-bottom:1px solid var(--line);}
  .topbar .leafmark{width:28px; height:28px; flex:none; color:var(--rule); cursor:pointer;}
  .topbar h1{font-size:18px; font-weight:700; letter-spacing:.02em;}
  .topbar .sub{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .topbar .backbtn{background:none; border:none; color:var(--ink); flex:none; padding:4px; margin-right:-2px;}
  .topbar .backbtn svg{width:22px; height:22px;}
  .topbar .spacer{flex:1;}
  .topbar .tbaction{background:none; border:none; color:var(--accent); font-weight:700; font-size:13.5px; padding:6px 4px;}

  main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; padding-bottom:28px;}
  main.flush{padding:0;}

  nav.tabbar{position:sticky; bottom:0; z-index:6; display:flex; background:var(--surface); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
  nav.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:6px 2px; border-radius:10px; color:var(--ink-soft); cursor:pointer;}
  nav.tabbar button svg{width:21px; height:21px;}
  nav.tabbar button span{font-size:10.5px; font-weight:500;}
  nav.tabbar button.active{color:var(--accent);}

  .toast{position:absolute; left:16px; right:16px; bottom:70px; z-index:30; background:var(--ink); color:var(--paper); padding:10px 14px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--danger); color:#fff;}

  .icon{width:18px; height:18px; flex:none;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:10px 14px; font-weight:500; cursor:pointer;}
  .btn.primary{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
  .btn.danger{color:var(--danger); border-color:var(--danger); background:var(--surface);}
  .btn.block{width:100%;}
  .btn.small{padding:6px 10px; font-size:12.5px; border-radius:8px;}
  .btn:disabled{opacity:.5; cursor:default;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.03em;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); width:100%;}
  .field textarea{resize:vertical; min-height:140px; font-family:var(--font-body);}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .section-title{font-size:13px; font-weight:700; color:var(--ink-soft); letter-spacing:.03em; margin:20px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:var(--shadow);}

  /* rich text (keybox + bullets) */
  .keybox{display:inline-block; border:1.4px solid currentColor; border-radius:4px; padding:0 5px; margin:0 1px; font-weight:700; line-height:1.5;}
  .rt-line{min-height:1.5em;}
  .rt-blank{min-height:.6em;}
  .rt-list{margin:0; padding-left:1.2em;}
  .rt-list li{margin-bottom:.15em;}

  /* ---- list view with side index ---- */
  .listwrap{display:flex; gap:0; height:100%;}
  .listmain{flex:1; min-width:0; padding:16px; overflow-y:auto;}
  .sideindex{flex:none; width:44px; display:flex; flex-direction:column; gap:6px; padding:16px 4px; overflow-y:auto;}
  .sideindex .tab{border:1px solid var(--line); border-right:none; border-radius:8px 0 0 8px; background:var(--surface); color:var(--ink-soft); padding:8px 2px; cursor:pointer; min-height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; overflow:hidden;}
  .sideindex .tab.active{background:var(--accent-soft); color:var(--ink); border-color:var(--accent); transform:translateX(-5px); box-shadow:-2px 2px 4px rgba(0,0,0,.08);}
  .sideindex .tab .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .sideindex .tab .lbl{display:inline-block; white-space:nowrap; transform:rotate(90deg); font-size:11px; font-weight:700; letter-spacing:.03em;}

  .searchbar{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:12px;}
  .searchbar input{flex:1; border:none; background:none; outline:none; color:var(--ink);}
  .searchbar svg{width:16px; height:16px; color:var(--ink-soft); flex:none;}

  .empty{text-align:center; padding:48px 16px; color:var(--ink-soft);}
  .empty .icon-big{width:40px; height:40px; margin:0 auto 14px; color:var(--line);}
  .empty p{margin:0 0 16px; font-size:13.5px;}

  .notelist{display:flex; flex-direction:column; gap:10px;}
  .notecard{display:flex; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; box-shadow:var(--shadow); position:relative; cursor:pointer;}
  .notecard .typeicon{flex:none; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink-soft);}
  .notecard .typeicon svg{width:16px; height:16px;}
  .notecard .body{flex:1; min-width:0;}
  .notecard .body h3{font-size:14.5px; font-weight:700; margin-bottom:3px;}
  .notecard .snippet{font-size:12.5px; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .notecard .meta{display:flex; align-items:center; gap:8px; margin-top:7px;}
  .tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; border:1.4px solid currentColor;}
  .tag.none{color:var(--ink-soft);}
  .date{font-size:10.5px; color:var(--ink-soft);}
  .notecard .del{flex:none; background:none; border:none; color:var(--ink-soft); padding:4px; align-self:flex-start; cursor:pointer;}
  .notecard .del svg{width:16px; height:16px;}
  .notecard .del:hover{color:var(--danger);}

  .chooser{display:flex; flex-direction:column; gap:14px; padding-top:10vh;}
  .choosebtn{display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px 16px; border-radius:16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); cursor:pointer;}
  .choosebtn svg{width:34px; height:34px; color:var(--accent);}
  .choosebtn .t{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .choosebtn .d{font-size:12px; color:var(--ink-soft); text-align:center;}

  .catrow{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .catrow .dot{width:14px; height:14px; border-radius:50%; flex:none;}
  .catrow .name{flex:1; font-weight:500; font-size:14px;}
  .catrow .count{font-size:11.5px; color:var(--ink-soft);}
  .palette{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
  .swatch.selected{border-color:var(--ink);}
  .iconbtn{background:none; border:none; padding:4px; color:var(--ink-soft); cursor:pointer; border-radius:6px;}
  .iconbtn:hover{color:var(--ink);}
  .iconbtn svg{width:17px; height:17px;}

  /* ---- custom modal (replaces native confirm/prompt, which sandboxed hosts may block) ---- */
  .modalOverlay{position:fixed; inset:0; background:rgba(20,18,14,.5); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modalBox{background:var(--surface); border-radius:14px; padding:18px; max-width:320px; width:100%; box-shadow:var(--shadow); border:1px solid var(--line);}
  .modalMsg{font-size:13.5px; margin-bottom:14px; white-space:pre-wrap; line-height:1.6;}
  .modalInput{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); margin-bottom:14px;}
  .modalBtns{display:flex; gap:8px; justify-content:flex-end;}

  /* ---- flow canvas ---- */
  .canvasToolbar{display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border-bottom:1px solid var(--line); flex:none;}
  .canvasToolbar input.titlein{flex:1; border:none; background:none; font-weight:700; font-size:14.5px; color:var(--ink); min-width:0;}
  .canvasToolbar .zoombtns{display:flex; gap:2px; flex:none;}
  .canvasHint{flex:none; position:relative; font-size:11px; color:var(--ink-soft); text-align:center; padding:5px 26px 5px 10px; background:var(--accent-soft); border-bottom:1px solid var(--line);}
  .canvasHint .hintClose{position:absolute; right:4px; top:3px; background:none; border:none; color:var(--ink-soft); font-size:12px; padding:2px 5px; cursor:pointer;}
  /* The editing area IS the sheet. The outer strip is the "desk"; inside it the viewport
     is exactly as wide as the paper (capped to the screen), and the sheets themselves —
     punch holes, 5mm grid, page edges — are drawn in the world so that what is edited
     sits where it will print. */
  .canvasViewportOuter{flex:1; position:relative; overflow:hidden; background:#CFCBBE;}
  .canvasViewport{position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); overflow:hidden; touch-action:none; background:#CFCBBE;}
  .canvasWorld{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform;}
  .canvasWorld svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  /* one physical sheet of the mini loose-leaf, drawn behind the content */
  .sheetGuide{position:absolute; background-color:#fff;
    background-image:linear-gradient(#e3ddd0 1px, transparent 1px), linear-gradient(90deg,#e3ddd0 1px, transparent 1px);
    box-shadow:0 1px 4px rgba(0,0,0,.28); pointer-events:none;}
  .sheetHoles{position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-evenly; align-items:center; border-bottom:1px dashed #d8d2c2;}
  .sheetHoles span{width:5.5%; aspect-ratio:1; border-radius:50%; border:1px dashed #c3bdaa;}
  .sheetEnd{position:absolute; left:0; right:0; height:0; border-top:1px dashed #cfa89f;}
  .sheetNo{position:absolute; right:3px; bottom:2px; font-size:7px; color:#b9b2a0; letter-spacing:.04em;}
  /* Boxes. f-plain = a main-flow box: prints with no frame at all, so on the canvas it
     gets only a faint dashed guide (not ink). f-callout/f-emph/f-title do print a frame. */
  .flowNode{position:absolute; background:transparent; border:1.2px solid transparent; border-radius:5px; padding:5px 7px; font-size:11px; line-height:1.35; color:#1a1a1a; cursor:grab; overflow:hidden; user-select:none; touch-action:none;}
  .flowNode.f-plain{border-style:dashed; border-color:#9fb6cc; background:rgba(255,255,255,.35);}
  .flowNode.f-callout{border-color:#1a1a1a; background:#fff;}
  .flowNode.f-emph{border-width:1.8px; border-color:#1a1a1a; background:#fff; font-weight:700;}
  /* 見出しの枠だけ角を落とす。工程の箱(角丸)と一目で見分けがつくように。 */
  .flowNode.f-title{border-color:#1a1a1a; background:#fff; font-weight:700; font-size:12px; border-radius:0;}
  .flowNode.selected{outline:2px solid var(--accent); outline-offset:1px;}
  .flowNode textarea{width:100%; height:100%; border:none; background:none; resize:none; outline:none; font:inherit; color:inherit; padding:0;}
  .flowGhost{position:absolute; border:1.6px dashed var(--accent); border-radius:8px; background:var(--accent-soft); opacity:.85; pointer-events:none;}
  .flowArrowLabel{position:absolute; background:rgba(255,255,255,.85); font-size:9.5px; padding:0 3px; color:#1a1a1a; white-space:nowrap; pointer-events:auto; cursor:pointer; transform:translate(-50%,-50%);}
  /* An arrow's label prints as plain text to the RIGHT of the line — no bubble, no box.
     On the canvas it carries a faint dashed guide so it stays tappable. */
  .flowArrowLabel.vlabel{left:calc(var(--vx,0px) + 7px); transform:translate(0,-50%); white-space:normal; max-width:150px; line-height:1.3;
    background:transparent; border:1px dashed #9fbca6; border-radius:3px; padding:1px 3px;}
  .canvasFab{position:absolute; right:14px; bottom:14px; width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); border:none; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); z-index:3;}
  .canvasFab svg{width:22px; height:22px;}
  .zoombtn{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center;}
  /* Alternate frame designs for the auto title box, cycled by double-tapping it. */
  .flowNode.f-title.frame-double{box-shadow:0 0 0 1.4px #fff, 0 0 0 2.6px #1a1a1a;}
  .flowNode.f-title.frame-thin{border-width:0.8px; font-weight:500;}
  .flowNode.f-title.frame-underline{border:none; border-bottom:1.8px solid #1a1a1a; border-radius:0; background:transparent; padding-left:1px;}
  .flowNodeWrap{position:absolute;}
  /* 縦の矢印につく、左右に動かすためのつまみ。編集中だけのもので、印刷には出ない。 */
  .arrowHandle{position:absolute; width:11px; height:11px; border-radius:50%; background:var(--surface);
    border:1.6px solid var(--accent); transform:translate(-50%,-50%); cursor:ew-resize; touch-action:none;
    z-index:3; box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .arrowHandle.dragging{background:var(--accent);}
  .nodeBtn{position:absolute; width:19px; height:19px; border-radius:50%; background:var(--surface); border:1.3px solid var(--ink); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; line-height:1; cursor:pointer; z-index:2; user-select:none; touch-action:none; padding:0;}
  /* the selected box's controls, in a small bar clear of the box's own edges so that
     swiping from the box is never intercepted by a button */
  .nodeCtrls{position:absolute; right:0; top:-24px; display:flex; gap:5px; z-index:4;}
  .nodeCtrls.below{top:auto; bottom:-24px;}
  .nodeCtrls .nodeBtn{position:static; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .nodeBtn.addAnno{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
  .nodeBtn.styleToggle.active{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
  .nodeBtn.moveHandle{background:var(--surface); color:var(--accent); border-color:var(--accent); cursor:grab; font-size:12px;}
  .nodeBtn.delBtn{background:var(--surface); color:var(--danger); border-color:var(--danger); font-size:10px;}
  /* A note prints as plain text (with its bracket, which IS ink) — the dashed outline is
     only an edit-time guide, like the boxes above. */
  .flowAnnotation{position:absolute; background:rgba(255,255,255,.4); border:1px dashed #9fbca6; border-radius:4px; padding:3px 5px; font-size:10px; line-height:1.4; color:#1a1a1a; cursor:grab; user-select:none; touch-action:none;}
  .flowAnnotation.selected{outline:2px solid var(--accent); outline-offset:1px;}
  .annoGroup{border-left:1.6px solid #555; border-radius:4px 0 0 4px; padding-left:5px; margin:1px 0 1px 1px;}
  .flowDivider{position:absolute; height:0; border-top:1.4px solid #666; touch-action:none; cursor:grab;}
  .dividerHandle{position:absolute; width:13px; height:13px; border-radius:50%; background:#666; touch-action:none; cursor:ew-resize; transform:translate(-50%,-50%);}
  .annoEditBox{background:var(--surface); border-radius:14px; padding:16px; max-width:340px; width:100%; box-shadow:var(--shadow); border:1px solid var(--line);}
  .annoEditBox textarea{width:100%; min-height:110px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); padding:9px 11px; font-size:13px; resize:vertical; margin-bottom:10px; font-family:inherit;}
  .annoToolbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}

  /* ---- memo editor ---- */
  .memoToolbar{display:flex; gap:8px; padding:8px 10px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .memoSplit{display:flex; flex-direction:column; height:100%;}
  .memoSplit textarea{flex:1; border:none; border-bottom:1px solid var(--line); background:var(--surface-2); padding:12px 14px; resize:none; outline:none; font-size:14px; line-height:1.7;}
  .memoPreview{flex:1; padding:12px 14px; overflow-y:auto; background:var(--surface);}
  .memoPreview .ph{color:var(--ink-soft); font-size:12px;}

  /* ---- print ---- */
  .printPreviewWrap{overflow-x:auto; padding:6px 0 16px; -webkit-overflow-scrolling:touch;}
  .printSheet{background:#fff; color:#1a1a1a; margin:0 auto 14px; box-shadow:0 1px 6px rgba(0,0,0,.2); position:relative;}
  /* True physical mm size (matches @media print exactly) — the JS applies a CSS
     zoom to shrink this down to fit the screen. Using an approximate px size here
     (e.g. aspect-ratio + a fixed max-width) would scale the frame independently of
     the mm-based content inside it, causing the content to overflow the page edge. */
  .printSheet.mini{width:calc(var(--pw,86) * 1mm); height:calc(var(--ph,128) * 1mm);}
  .printSheet .holes{position:absolute; left:0; right:0; top:0; height:var(--holemm,16mm); display:flex; justify-content:space-evenly; align-items:center; pointer-events:none;}
  .printSheet .holes span{width:9%; aspect-ratio:1; max-width:14px; border-radius:50%; border:1px dashed #bbb;}
  .printSheet .grid{position:absolute; inset:0; background-image:linear-gradient(#e3ddd0 1px, transparent 1px), linear-gradient(90deg,#e3ddd0 1px, transparent 1px); background-size:var(--gridpx,15px) var(--gridpx,15px); opacity:.6;}
  .printSheet .content{position:absolute; overflow:hidden;}
  .printSheet .content .inner{position:absolute;}
  .printSheet .memotext{position:absolute; inset:0; padding:2mm; font-size:9pt; white-space:pre-wrap; overflow:hidden;}
  /* True A4 mm size for the same reason as .printSheet.mini above — the nested mini
     sheets inside each cell are true-mm-sized too, so the grid must be as well. */
  .a4sheet{background:#fff; margin:0 auto 16px; box-shadow:0 1px 6px rgba(0,0,0,.2); display:grid; grid-template-columns:repeat(2,1fr); gap:4mm; padding:6mm; width:210mm; height:297mm;}
  .a4sheet .cell{border:1px dashed #999; position:relative; overflow:hidden;}
  @media print{
    body *{visibility:hidden;}
    #printRoot, #printRoot *{visibility:visible;}
    #printRoot{position:absolute; left:0; top:0; width:auto; padding:0; margin:0; background:#fff;}
    .printSheet{box-shadow:none!important; margin:0!important; page-break-after:always;}
    .a4sheet{box-shadow:none!important; margin:0!important; page-break-after:always;}
    .printSheet:last-child, .a4sheet:last-child{page-break-after:auto;}
  }

  /* ---- keyboard input-assist bar ----
     A row of quick-insert symbol buttons docked just above the on-screen keyboard
     while typing in a flow box, an annotation, or a memo — so common marks (bullets,

  .kbdAssist button:active{background:var(--accent-soft); border-color:var(--accent);}

<script>
(function(){

    settings:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
    trash:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    flow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="6" rx="1.4"/><rect x="14" y="15" width="7" height="6" rx="1.4"/><path d="M6.5 9v3a3 3 0 0 0 3 3H14"/><path d="M17.5 15v-3a3 3 0 0 0-3-3h-1"/></svg>',
    memo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4Z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    zin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>',
    zout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>'
  };
  var iconKeys = {list:'list', add:'add', categories:'tag', print:'print', settings:'settings'};
  var tabLabels = {list:'一覧', add:'追加', categories:'カテゴリ', print:'印刷', settings:'設定'};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(){ try{ return crypto.randomUUID(); }catch(e){ return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9); } }
  function nowIso(){ return new Date().toISOString(); }
  function fmtDate(iso){ try{ var d=new Date(iso); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }catch(e){ return ''; } }
  function nowStamp(){ var d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); }
  function byOrder(a,b){ return (a.order||0)-(b.order||0); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // Shared vertical-edge label wrapping (used by both the canvas-side gap
  // auto-adjustment and the print SVG renderer, in mm units), so a long or
  // crowded arrow label wraps to multiple lines consistently everywhere and
  // the space it needs can be computed once and reused.
  function wrapEdgeLabel(label){
    var maxW=32, charW=2.3, maxChars=Math.max(4, Math.floor((maxW-3.4)/charW));
    var lines=[]; var rest=label||'';
    while(rest.length>maxChars){ lines.push(rest.slice(0,maxChars)); rest=rest.slice(maxChars); }
    lines.push(rest);
    var longest = Math.max.apply(null, lines.map(function(l){return l.length;}));
    var lineH=3.3, boxH=2+lines.length*lineH, estW=Math.min(maxW, 5+longest*charW);
    return {lines:lines, boxH:boxH, estW:estW, lineH:lineH, maxW:maxW};
  }

  // Pure, note-object-only version of the same gap auto-adjustment the flow
  // editor applies live, so the print engine (which has no access to the
  // editor's FE/nodesArr state) can self-heal a note's layout too — e.g. a
  // note saved by an older version of the app, before this fix existed.
  // Mutates note.nodes/dividers in place; returns true if it changed anything.
  function ensureFlowEdgeGaps(note){
    if(!note || !note.nodes || !note.nodes.length) return false;
    var nodes = note.nodes, edges = note.edges||[];
    function nb(id){ return nodes.find(function(n){return n.id===id;}); }
    var changed=false;
    edges.forEach(function(e){
      if(!e.vertical || !e.label) return;
      var a=nb(e.from), b=nb(e.to);
      if(!a||!b) return;
      var ah=a.h||MM_PER_NODE_H, bh=b.h||MM_PER_NODE_H;
      var belowsource = b.y>=a.y;
      var topNode=belowsource?a:b, topH=belowsource?ah:bh;
      var bottomNode=belowsource?b:a;
      var gap = bottomNode.y-(topNode.y+topH);
      var wrapped = wrapEdgeLabel(e.label);
      var needed = wrapped.boxH+2;
      if(gap>=needed) return;
      shiftContentBelow(note, bottomNode.y-0.01, needed-gap);
      changed=true;
    });
    return changed;
  }

  // ---------- paper geometry (one definition, shared by the editor and the printer) ----------
  // World coordinates are millimetres, and x=0 / y=0 is the TOP-LEFT OF THE PRINTABLE AREA
  // of the first sheet — i.e. marginMm in from the paper's left edge, holeMm down from its
  // top edge. Everything (canvas, print, page breaks) derives from that one anchor, so what
  // is edited and what is printed line up exactly.
  function fullWidthMm(){ var s=state.settings; return Math.max(20, (s.paperW||86) - (s.marginMm||3)*2); }
  // How tall one sheet's writable band is...
  function pageHeightMm(){ var s=state.settings; return Math.max(20, (s.paperH||128) - (s.holeMm||16) - (s.marginMm||3)); }
  // ...and how far apart consecutive bands sit. Sheets are separate pieces of paper, so
  // between the bottom of one band and the top of the next there is a dead strip (the
  // sheet's bottom margin plus the next sheet's punch-hole zone) that content may not
  // occupy. Spacing the bands by the full paper height keeps the sheets from overlapping
  // and means a box is never split across two sheets.
  function pagePitchMm(){ var s=state.settings; return Math.max(pageHeightMm()+1, s.paperH||128); }
  function pageIndexOf(ymm){ return Math.max(0, Math.floor((ymm+0.01)/pagePitchMm())); }
  function bandTopMm(k){ return k*pagePitchMm(); }
  function bandBottomMm(k){ return k*pagePitchMm() + pageHeightMm(); }
  // Where a block of height h can start if it wants to begin at/after y without
  // straddling the end of a sheet.
  function placeInBand(ymm, hmm){
    var k = pageIndexOf(ymm);
    if(ymm + (hmm||0) > bandBottomMm(k) + 0.01) return bandTopMm(k+1);
    return ymm;
  }
  // After anything has been pushed down (a wrapped arrow label, a note), a box may have
  // landed in a dead strip — walk the content top-to-bottom and move such boxes (with
  // everything below them) onto the next sheet.
  function snapOutOfDeadZones(note){
    if(!note || !note.nodes) return false;
    var changed=false;
    for(var pass=0; pass<8; pass++){
      var hit=null;
      note.nodes.slice().sort(function(a,b){return a.y-b.y;}).forEach(function(n){
        if(hit) return;
        var k = pageIndexOf(n.y);
        if(n.y + nodeHmm(n) > bandBottomMm(k) + 0.01) hit = {node:n, k:k};
      });
      if(!hit) break;
      shiftContentBelow(note, hit.node.y-0.01, bandTopMm(hit.k+1) - hit.node.y);
      changed=true;
    }
    return changed;
  }
  // A "full" box belongs to the main flow. On its own it spans the whole printable
  // width; when several steps branch from the same box they share one row, and `cols`
  // says how many ways that row is split — two steps side by side get half each.
  var COL_GAP_MM = 4;
  function colWidthMm(cols){
    var c = Math.max(1, cols||1);
    return Math.max(12, (fullWidthMm() - COL_GAP_MM*(c-1)) / c);
  }
  function colXMm(i, cols){ return i * (colWidthMm(cols) + COL_GAP_MM); }
  function nodeWmm(n){ return n.full ? colWidthMm(n.cols||1) : (n.w||MM_PER_NODE_W); }
  function nodeHmm(n){ return n.h||MM_PER_NODE_H; }
  function dividerWmm(d){ return d.full ? fullWidthMm() : (d.w||fullWidthMm()); }
  // What kind of frame a box gets. The rule the printed page follows: only real ink is
  // drawn — the title's frame, an emphasised box's frame and a small call-out's frame.
  // A full-width box of the main flow prints with NO frame at all (the editor shows a
  // faint dashed guide for it instead, which is not ink).
  function frameKindOf(n){
    if(n.isTitleNode) return 'title';
    if(n.style==='heading') return 'emph';
    if(n.full) return 'plain';
    return 'callout';
  }
  function annoLinesOf(a){
    var raw = (a.text||'').split('\n');
    var n = 0;
    raw.forEach(function(l){ n += Math.max(1, Math.ceil(l.length/22)); });
    return Math.max(1, n);
  }
  function annoHeightMm(a){ return 3 + annoLinesOf(a)*3.4; }
  // Pushes everything at/below thresholdY further down, keeping relative layout intact.
  function shiftContentBelow(note, thresholdY, dy){
    if(dy<=0) return;
    (note.nodes||[]).forEach(function(n){
      if(n.y >= thresholdY){
        n.y += dy;
        (n.annotations||[]).forEach(function(a){ a.y += dy; });
      }
    });
    (note.dividers||[]).forEach(function(d){ if(d.y >= thresholdY) d.y += dy; });
  }

  // One-time cleanup of notes laid out by earlier versions, which put the main trunk at
  // x=2mm with a baked-in width (and annotations at x≈86mm, off the page entirely), and
  // let content run straight through page boundaries.
  function normalizeFlowGeometry(note){
    if(!note || note.type!=='flow' || note.geomV2) return false;
    var fw = fullWidthMm();
    var nodes = note.nodes||[], dividers = note.dividers||[];
    // Old y values assumed pages butted together with no dead strip between sheets.
    var oldPitch = pageHeightMm(), pitch = pagePitchMm();
    function remapY(y){ var k = Math.max(0, Math.floor(y/oldPitch)); return k*pitch + (y - k*oldPitch); }
    nodes.forEach(function(n){
      n.y = remapY(n.y);
      (n.annotations||[]).forEach(function(a){ a.y = remapY(a.y); });
    });
    dividers.forEach(function(d){ d.y = remapY(d.y); });
    nodes.forEach(function(n){
      var w = n.w||MM_PER_NODE_W;
      if(n.isTitleNode || w >= fw-6){ n.full = true; n.x = 0; }
      else {
        if(n.x>0 && n.x<=2) n.x = 0;
        // A branch box parked beyond the paper's edge (the old geometry allowed that) is
        // invisible and unprintable — bring it back onto the sheet.
        if(n.x + w > fw){ n.w = Math.min(w, fw); n.x = Math.max(0, fw - n.w); }
      }
    });
    dividers.forEach(function(d){
      if((d.w||0) >= fw-6){ d.full = true; d.x = 0; }
      else if(d.x>0 && d.x<=2){ d.x = 0; }
    });
    nodes.slice().forEach(function(n){
      (n.annotations||[]).forEach(function(a){
        if(a.x + 24 > fw){
          // Was parked off the right edge of the paper — bring it under its own box and
          // make room for it so it doesn't land on top of the next step.
          var below = n.y + nodeHmm(n) + 2;
          shiftContentBelow(note, below, annoHeightMm(a) + 3);
          a.x = Math.min(3, Math.max(0, fw-30));
          a.y = below;
        }
      });
    });
    snapOutOfDeadZones(note);
    note.geomV2 = true;
    return true;
  }

  // rich text: 【key】 boxes + ・bullet lines, shared by memo preview / node display / print
  function boxify(escapedLine){ return escapedLine.replace(/【([^】]*)】/g, '<span class="keybox">$1</span>'); }
  function renderRichText(raw){
    var lines = esc(raw||'').split('\n');
    var html=''; var inList=false;
    lines.forEach(function(line){
      var m = line.match(/^・(.*)/);
      if(m){
        if(!inList){ html+='<ul class="rt-list">'; inList=true; }
        html += '<li>'+boxify(m[1])+'</li>';
      } else {
        if(inList){ html+='</ul>'; inList=false; }
        html += line.trim()==='' ? '<div class="rt-blank">&nbsp;</div>' : ('<div class="rt-line">'+boxify(line)+'</div>');
      }
    });
    if(inList) html+='</ul>';
    return html;
  }
  function plainSnippet(raw){ return esc((raw||'').replace(/[【】・\n]/g,' ').replace(/\s+/g,' ').trim().slice(0,110)); }

  // annotation rich text: same as renderRichText, but a set of line-ranges can be wrapped
  // in a bracket-style "group" (くくり括弧) — used for things like listing tea types together.
  function renderAnnotationHtml(raw, groups){
    var lines = (raw||'').split('\n');
    var gs = (groups||[]).slice().sort(function(a,b){return a.start-b.start;});
    var html=''; var i=0;
    while(i<lines.length){
      var g = gs.find(function(gr){ return gr.start===i; });
      if(g && g.end>=g.start && g.end<lines.length){
        html += '<div class="annoGroup">'+renderRichText(lines.slice(g.start,g.end+1).join('\n'))+'</div>';
        i = g.end+1;
      } else {
        html += renderRichText(lines[i]);
        i++;
      }
    }
    return html;
  }

  var PALETTE = [
    {name:'あか', hex:'#B33F32'}, {name:'だいだい', hex:'#BD7A34'},
    {name:'きいろ', hex:'#A98B2C'}, {name:'みどり', hex:'#4C7A50'},
    {name:'みずいろ', hex:'#3B7EA6'}, {name:'あお', hex:'#2E4A73'},
    {name:'むらさき', hex:'#6B4C82'}, {name:'ぐれー', hex:'#66655A'}
  ];

  // marginMm is the paper's own outer margin: 3mm each side on 86mm paper leaves an
  // 80mm printable width, which is the width a flow is allowed to use.
  var DEFAULT_SETTINGS = {
    paperW:86, paperH:128, holeMm:16, marginMm:3, gridMm:5,
    printMode:'mini', fontPt:9
  };
  var LOCAL_KEY = 'leafnote_data_v2';
  // A box is only as tall as what is written in it; this is the one-line floor, which
  // the editor measures against and then stores the real height back onto the box.
  var MM_PER_NODE_W = 34, MM_PER_NODE_H = 9;

  var state = {
    tab:'list', notes:[], categories:[], settings:Object.assign({},DEFAULT_SETTINGS),
    storageMode:null, dbCap:null, downloadsCap:null,
    filterCat:'all', searchQ:'', ready:false,
    openId:null, // note currently open in flow/memo editor
    printCat:'all'
  };

  // ---------- storage ----------
  function loadLocal(){ try{ var raw=localStorage.getItem(LOCAL_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

  // 削除したメモ/カテゴリのIDと日時。これが無いと、別の端末から同期したときに
  // 消したはずのメモが戻ってきてしまう。
  var TOMB_KEY = 'leafnote_deleted_v1';
  var tombstones = (function(){ try{ return JSON.parse(localStorage.getItem(TOMB_KEY)||'{}')||{}; }catch(e){ return {}; } })();
  function getTombstones(){ return tombstones; }
  function setTombstones(map){ tombstones = map||{}; try{ localStorage.setItem(TOMB_KEY, JSON.stringify(tombstones)); }catch(e){} }
  // 削除の時刻は「消した瞬間」と「消したものの更新時刻の直後」の遅いほう。
  // 端末どうしの時計が少しずれていても、削除が更新に負けて復活しないようにするため。
  function markDeleted(id, item){
    if(!id) return;
    var now = Date.now();
    var u = item && item.updatedAt ? Date.parse(item.updatedAt) : 0;
    if(isNaN(u)) u = 0;
    tombstones[id] = new Date(Math.max(now, u + 1000)).toISOString();
    setTombstones(tombstones);
  }

  var suppressSync = false;
  function writeLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({notes:state.notes, categories:state.categories, settings:state.settings})); }catch(e){} }
  function saveLocalAll(){
    writeLocal();
    if(!suppressSync && window.LNSync && window.LNSync.schedulePush) window.LNSync.schedulePush();
  }
  // 同期が持ち帰ったデータを書き戻すとき用 : これでまた同期を呼ぶと堂々巡りになる
  function saveLocalQuiet(){ suppressSync = true; try{ writeLocal(); } finally { suppressSync = false; } }

  function inLiveEditor(){ return state.tab==='flow' || state.tab==='memo'; }
  function subscribeDb(){
    state.dbCap.collection('notes').onSnapshot(function(snap){
      state.notes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(state.ready && !inLiveEditor()) window.App.renderCurrentTab();
    }, function(){ showToast('メモの同期でエラーが発生しました','error'); });
    state.dbCap.collection('categories').onSnapshot(function(snap){
      state.categories = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(state.ready && !inLiveEditor()) window.App.renderCurrentTab();
    }, function(){});
    state.dbCap.doc('settings/print').onSnapshot(function(snap){
      if(snap.exists) state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.data());
      if(state.ready && !inLiveEditor()) window.App.renderCurrentTab();
    }, function(){});
  }

  async function initStorage(){
    var db=null, downloads=null;
    try{ db = window.claude ? await window.claude.use('db') : null; }catch(e){ db=null; }
    try{ downloads = window.claude ? await window.claude.use('downloads') : null; }catch(e){ downloads=null; }
    state.downloadsCap = downloads;
    if(db){ state.dbCap=db; state.storageMode='db'; subscribeDb(); }
    else {
      state.storageMode='local';
      var local = loadLocal();
      if(local){ state.notes=local.notes||[]; state.categories=local.categories||[]; state.settings=Object.assign({},DEFAULT_SETTINGS, local.settings||{}); }
    }
    migrateMargin();
    state.ready = true;
    window.App.renderCurrentTab();
  }

  // Earlier versions defaulted to a 5mm margin, which left a 76mm printable width and
  // (with the old 2mm box offset) pushed full-width boxes off the right edge. The paper
  // is meant to be used to 3mm from each side — move anyone still on the old default over.
  function migrateMargin(){
    if(state.settings.marginV2) return;
    if((state.settings.marginMm||0) === 5) state.settings.marginMm = 3;
    state.settings.marginV2 = true;
    if(state.storageMode==='db'){ try{ state.dbCap.doc('settings/print').set(state.settings); }catch(e){} }
    else saveLocalAll();
  }

  async function upsertNote(note){
    note.updatedAt = nowIso();
    if(!note.createdAt) note.createdAt = note.updatedAt;
    if(state.storageMode==='db'){
      var id = note.id || uid();
      var body = Object.assign({}, note); delete body.id;
      await state.dbCap.collection('notes').doc(id).set(body);
      return id;
    } else {
      var id2 = note.id || uid();
      var full = Object.assign({}, note, {id:id2});
      var idx = state.notes.findIndex(function(n){return n.id===id2;});
      if(idx>=0) state.notes[idx]=full; else state.notes.push(full);
      saveLocalAll();
      return id2;
    }
  }
  async function patchNote(id, patch){
    var n = state.notes.find(function(x){return x.id===id;});
    if(!n) return;
    var full = Object.assign({}, n, patch);
    await upsertNote(full);
    // Note: intentionally does NOT trigger a full renderCurrentTab() — the flow/memo
    // editors manage their own live rendering (renderCanvas/renderMemoPreview) and
    // would have their transient edit state wiped by a full re-render on every save.
  }
  async function deleteNoteById(id){
    if(state.storageMode==='db'){ await state.dbCap.collection('notes').doc(id).delete(); }
    else { markDeleted(id, state.notes.find(function(n){return n.id===id;})); state.notes = state.notes.filter(function(n){return n.id!==id;}); saveLocalAll(); window.App.renderCurrentTab(); }
  }
  async function upsertCategory(cat){
    cat = Object.assign({}, cat, {updatedAt: nowIso()});
    if(state.storageMode==='db'){
      var id = cat.id || uid();
      var body = Object.assign({}, cat); delete body.id;
      await state.dbCap.collection('categories').doc(id).set(body);
      return id;
    } else {
      var id2 = cat.id || uid();
      var full = Object.assign({}, cat, {id:id2});
      var idx = state.categories.findIndex(function(c){return c.id===id2;});
      if(idx>=0) state.categories[idx]=full; else state.categories.push(full);
      saveLocalAll(); window.App.renderCurrentTab();
      return id2;
    }
  }
  async function deleteCategoryById(id){
    var orphans = state.notes.filter(function(n){ return n.categoryId===id; });
    if(state.storageMode==='db'){
      for(var i=0;i<orphans.length;i++){ var b=Object.assign({}, orphans[i], {categoryId:''}); delete b.id; await state.dbCap.collection('notes').doc(orphans[i].id).set(b); }
      await state.dbCap.collection('categories').doc(id).delete();
    } else {
      orphans.forEach(function(n){ n.categoryId=''; n.updatedAt = nowIso(); });
      markDeleted(id, state.categories.find(function(c){return c.id===id;}));
      state.categories = state.categories.filter(function(c){return c.id!==id;});
      saveLocalAll(); window.App.renderCurrentTab();
    }
  }
  async function saveSettings(patch){
    state.settings = Object.assign({}, state.settings, patch, {updatedAt: nowIso()});
    if(state.storageMode==='db'){ await state.dbCap.doc('settings/print').set(state.settings); }
    else { saveLocalAll(); window.App.renderCurrentTab(); }
  }
  // Same, but without the re-render: for flags set from inside a live editor (which a
  // full re-render would tear down mid-edit), such as "the hint has been seen".
  function saveSettingsQuiet(patch){
    state.settings = Object.assign({}, state.settings, patch, {updatedAt: nowIso()});
    if(state.storageMode==='db'){ try{ state.dbCap.doc('settings/print').set(state.settings); }catch(e){} }
    else saveLocalAll();
  }

  // ---------- toast ----------
  var toastTimer;
  function showToast(msg, type){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type==='error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3000);
  }

  function catById(id){ return state.categories.find(function(c){return c.id===id;}); }

  // Custom confirm/prompt dialogs — some hosts sandbox out window.confirm/prompt
  // (they silently no-op or always return false), so all delete/label flows use these instead.
  function lnConfirm(message){
    return new Promise(function(resolve){
      var ov = document.createElement('div'); ov.className='modalOverlay';
      ov.innerHTML = '<div class="modalBox"><div class="modalMsg"></div><div class="modalBtns"><button class="btn" data-a="cancel">キャンセル</button><button class="btn primary" data-a="ok">OK</button></div></div>';
      ov.querySelector('.modalMsg').textContent = message;
      document.body.appendChild(ov);
      function done(v){ if(ov.parentNode) document.body.removeChild(ov); resolve(v); }
      ov.addEventListener('click', function(e){
        if(e.target===ov){ done(false); return; }
        var b = e.target.closest('button'); if(!b) return;
        done(b.dataset.a==='ok');
      });
      var okBtn = ov.querySelector('[data-a="ok"]');
      if(okBtn) okBtn.focus();
    });
  }
  function lnPrompt(message, defVal){
    return new Promise(function(resolve){
      var ov = document.createElement('div'); ov.className='modalOverlay';
      ov.innerHTML = '<div class="modalBox"><div class="modalMsg"></div><input type="text" class="modalInput"><div class="modalBtns"><button class="btn" data-a="cancel">キャンセル</button><button class="btn primary" data-a="ok">OK</button></div></div>';
      ov.querySelector('.modalMsg').textContent = message;
      var input = ov.querySelector('.modalInput');
      input.value = defVal||'';
      document.body.appendChild(ov);
      input.focus(); input.select();
      function done(v){ if(ov.parentNode) document.body.removeChild(ov); resolve(v); }
      ov.addEventListener('click', function(e){
        if(e.target===ov){ done(null); return; }
        var b = e.target.closest('button'); if(!b) return;
        done(b.dataset.a==='ok' ? input.value : null);
      });
      input.addEventListener('keydown', function(e){
        if(e.key==='Enter'){ e.preventDefault(); done(input.value); }
        else if(e.key==='Escape'){ done(null); }
      });
    });
  }

  // A prompt with a third button: OK / キャンセル / 削除. Resolves to the typed text,
  // null when cancelled, or the string "__delete__" — so deleting something no longer
  // means typing a magic word into the box.
  function lnPromptOrDelete(message, defVal, delLabel){
    return new Promise(function(resolve){
      var ov = document.createElement('div'); ov.className='modalOverlay';
      ov.innerHTML = '<div class="modalBox"><div class="modalMsg"></div><input type="text" class="modalInput">' +
        '<div class="modalBtns" style="justify-content:space-between;">' +
          '<button class="btn danger" data-a="del">'+(delLabel||'削除')+'</button>' +
          '<div style="display:flex; gap:8px;"><button class="btn" data-a="cancel">キャンセル</button><button class="btn primary" data-a="ok">OK</button></div>' +
        '</div></div>';
      ov.querySelector('.modalMsg').textContent = message;
      var input = ov.querySelector('.modalInput');
      input.value = defVal||'';
      document.body.appendChild(ov);
      input.focus(); input.select();
      function done(v){ if(ov.parentNode) document.body.removeChild(ov); resolve(v); }
      ov.addEventListener('click', function(e){
        if(e.target===ov){ done(null); return; }
        var b = e.target.closest('button'); if(!b) return;
        if(b.dataset.a==='ok') done(input.value);
        else if(b.dataset.a==='del') done('__delete__');
        else done(null);
      });
      input.addEventListener('keydown', function(e){
        if(e.key==='Enter'){ e.preventDefault(); done(input.value); }
        else if(e.key==='Escape'){ done(null); }
      });
    });
  }

  // Shared cursor-insertion helpers for any textarea (node text, annotation text, memo
  // body) — used both by editor-specific toolbars and by the global keyboard-assist bar.
  function insertAtCursor(ta, str){
    var s=ta.selectionStart, e=ta.selectionEnd;
    var v=ta.value;
    ta.value = v.slice(0,s)+str+v.slice(e);
    var cur = s+str.length;
    ta.focus(); ta.setSelectionRange(cur,cur);
    ta.dispatchEvent(new Event('input', {bubbles:true}));
  }
  function wrapSelection(ta, open, close){
    var s=ta.selectionStart, e=ta.selectionEnd;
    var v=ta.value;
    var sel = v.slice(s,e);
    ta.value = v.slice(0,s)+open+sel+close+v.slice(e);
    var cur = sel ? s+sel.length+open.length+close.length : s+open.length;
    ta.focus(); ta.setSelectionRange(cur,cur);
    ta.dispatchEvent(new Event('input', {bubbles:true}));
  }

  // A row of quick-insert buttons (bullets, arrows, checkboxes, key-brackets...) that
  // docks just above the on-screen keyboard whenever a flow box / annotation / memo
  // textarea is focused — any textarea marked class="assistTa" gets it automatically.
  function setupKeyboardAssist(){
    var bar = document.getElementById('kbdAssist');
    if(!bar) return;
    function targetTa(){
      var el = document.activeElement;
      return (el && el.tagName==='TEXTAREA' && el.classList.contains('assistTa')) ? el : null;
    }
    // Sit the bar exactly on top of the keyboard. Measuring the gap from the bottom of
    // the layout viewport left a strip of empty page between the bar and the keyboard
    // (the layout viewport can be taller than the window inside an app's web view), so
    // the bar is pinned to the bottom edge of the VISUAL viewport instead.
    function position(){
      if(bar.hidden) return;
      var vv = window.visualViewport;
      if(!vv){ bar.style.top='auto'; bar.style.bottom='0px'; return; }
      var h = bar.offsetHeight || 48;
      bar.style.bottom = 'auto';
      bar.style.top = Math.max(0, Math.round(vv.offsetTop + vv.height - h)) + 'px';
      if(window.LN && window.LN.onKeyboardGeometry) window.LN.onKeyboardGeometry();
    }
    window.LN.kbdAssistHeight = function(){ return bar.hidden ? 0 : (bar.offsetHeight||0); };
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', position);
      window.visualViewport.addEventListener('scroll', position);
    }
    window.addEventListener('resize', position);
    // Capture-phase focus/blur (rather than the bubbling focusin/focusout) — more
    // reliably observed at the document level across this app's nested pointer-event
    // handling than the bubbling variants.
    document.addEventListener('focus', function(e){
      if(e.target && e.target.tagName==='TEXTAREA' && e.target.classList.contains('assistTa')){
        bar.hidden = false;
        position();
      }
    }, true);
    document.addEventListener('blur', function(e){
      if(e.target && e.target.tagName==='TEXTAREA' && e.target.classList.contains('assistTa')){
        setTimeout(function(){ if(!targetTa()) bar.hidden = true; }, 80);
      }
    }, true);
    // mousedown (not click) with preventDefault keeps focus on the textarea instead of
    // moving it to the button, so selectionStart/End stay valid for insertion.
    bar.addEventListener('mousedown', function(e){ e.preventDefault(); });
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-act]');
      if(!btn) return;
      var ta = targetTa();
      if(!ta) return;
      var act = btn.dataset.act;
      if(act==='undo'){ try{ document.execCommand('undo'); }catch(err){} }
      else if(act==='redo'){ try{ document.execCommand('redo'); }catch(err){} }
      else if(act==='ins'){ insertAtCursor(ta, btn.dataset.val); }
      else if(act==='wrap'){ wrapSelection(ta, '【', '】'); }
    });
  }

  window.LN = { state:state, ICONS:ICONS, esc:esc, uid:uid, nowIso:nowIso, fmtDate:fmtDate, nowStamp:nowStamp,
    byOrder:byOrder, clamp:clamp, renderRichText:renderRichText, renderAnnotationHtml:renderAnnotationHtml, plainSnippet:plainSnippet, PALETTE:PALETTE, wrapEdgeLabel:wrapEdgeLabel, ensureFlowEdgeGaps:ensureFlowEdgeGaps,
    fullWidthMm:fullWidthMm, pageHeightMm:pageHeightMm, pagePitchMm:pagePitchMm, pageIndexOf:pageIndexOf,
    bandTopMm:bandTopMm, bandBottomMm:bandBottomMm, placeInBand:placeInBand, snapOutOfDeadZones:snapOutOfDeadZones,
    nodeWmm:nodeWmm, nodeHmm:nodeHmm, dividerWmm:dividerWmm, colWidthMm:colWidthMm, colXMm:colXMm, COL_GAP_MM:COL_GAP_MM,
    frameKindOf:frameKindOf, annoHeightMm:annoHeightMm, shiftContentBelow:shiftContentBelow, normalizeFlowGeometry:normalizeFlowGeometry,
    insertAtCursor:insertAtCursor, wrapSelection:wrapSelection, setupKeyboardAssist:setupKeyboardAssist,
    DEFAULT_SETTINGS:DEFAULT_SETTINGS, MM_PER_NODE_W:MM_PER_NODE_W, MM_PER_NODE_H:MM_PER_NODE_H,
    upsertNote:upsertNote, patchNote:patchNote, deleteNoteById:deleteNoteById, upsertCategory:upsertCategory,
    deleteCategoryById:deleteCategoryById, saveSettings:saveSettings, saveSettingsQuiet:saveSettingsQuiet, showToast:showToast, catById:catById,
    confirm:lnConfirm, prompt:lnPrompt, promptOrDelete:lnPromptOrDelete,
    getTombstones:getTombstones, setTombstones:setTombstones, markDeleted:markDeleted,
    saveLocalAll:saveLocalAll, saveLocalQuiet:saveLocalQuiet,
    initStorage:initStorage };
})();
</script>
<script>
(function(){
  "use strict";
  var LN = window.LN, state = LN.state, ICONS = LN.ICONS, esc = LN.esc, byOrder = LN.byOrder;

  function setMain(flush){ document.getElementById('view').className = flush ? 'flush' : ''; }

  function renderCurrentTab(){
    document.querySelectorAll('nav.tabbar button').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab===state.tab);
    });
    var view = document.getElementById('view');
    var topbar = document.getElementById('topbar');
    if(!state.ready){ setMain(false); view.innerHTML = '<div class="empty"><p>読み込み中…</p></div>'; return; }

    // フロー編集を抜けるときはページのロックを外す(開くときに openFlowEditor が付け直す)
    document.body.classList.remove('canvasLock');
    if(state.tab==='flow' || state.tab==='memo'){
      // editor views manage their own topbar via App.renderTopbarFor*
    } else {
      topbar.innerHTML = '<svg class="leafmark" onclick="App.goTab(\'list\')" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18C4 9 11 4 20 4c0 9-5 16-14 16-2 0-3-.5-3-2Z"/><path d="M4 18c4-3 7-7 9-12"/></svg>' +
        '<div><h1>リーフノート</h1><div class="sub">'+({list:'メモを整理して、印刷用にレイアウト', add:'新しいメモを作る', categories:'カテゴリの管理', print:'印刷レイアウト', settings:'設定・バックアップ'}[state.tab]||'')+'</div></div>';
    }

    if(state.tab==='list'){ setMain(true); view.innerHTML = renderList(); wireList(); }
    else if(state.tab==='add'){ setMain(false); view.innerHTML = renderChooser(); }
    else if(state.tab==='categories'){ setMain(false); view.innerHTML = renderCategories(); }
    else if(state.tab==='print'){ setMain(false); view.innerHTML = App.renderPrint(); App.wirePrint && App.wirePrint(); }
    else if(state.tab==='settings'){ setMain(false); view.innerHTML = renderSettings(); wireSettings(); }
    else if(state.tab==='flow'){ App.openFlowEditor(state.openId); }
    else if(state.tab==='memo'){ App.openMemoEditor(state.openId); }
  }

  // ---------- LIST + SIDE INDEX ----------
  function visibleNotes(){
    var list = state.notes.slice().sort(byOrder);
    if(state.filterCat!=='all') list = list.filter(function(n){ return (n.categoryId||'')===state.filterCat; });
    if(state.searchQ){
      var q = state.searchQ.toLowerCase();
      list = list.filter(function(n){
        var hay = (n.title||'') + ' ' + (n.content||'') + ' ' + (n.nodes? n.nodes.map(function(nd){
          return (nd.text||'') + ' ' + (nd.annotations||[]).map(function(a){return a.text||'';}).join(' ');
        }).join(' '):'');
        return hay.toLowerCase().indexOf(q)>=0;
      });
    }
    return list;
  }

  function tabLabel(name){
    var s = String(name||'');
    return s.length>5 ? esc(s.slice(0,5))+'…' : esc(s);
  }
  function sideIndexHtml(){
    var cats = state.categories.slice().sort(byOrder);
    var tabs = '<button class="tab'+(state.filterCat==='all'?' active':'')+'" onclick="App.setFilter(\'all\')"><span class="lbl">すべて</span></button>';
    cats.forEach(function(c){
      tabs += '<button class="tab'+(state.filterCat===c.id?' active':'')+'" title="'+esc(c.name)+'" style="'+(state.filterCat===c.id?('background:'+c.hex+'22;border-color:'+c.hex+';'):'')+'" onclick="App.setFilter(\''+c.id+'\')"><span class="dot" style="background:'+c.hex+'"></span><span class="lbl">'+tabLabel(c.name)+'</span></button>';
    });
    tabs += '<button class="tab'+(state.filterCat===''?' active':'')+'" onclick="App.setFilter(\'\')"><span class="lbl">未分類</span></button>';
    return '<div class="sideindex">'+tabs+'</div>';
  }

  function renderList(){
    var search = '<div class="searchbar">'+ICONS.search+'<input type="text" id="searchInput" placeholder="メモを検索" value="'+esc(state.searchQ)+'"></div>';
    var list = visibleNotes();
    var main;
    if(list.length===0){
      main = search + '<div class="empty"><svg class="icon-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 18C4 9 11 4 20 4c0 9-5 16-14 16-2 0-3-.5-3-2Z"/></svg>' +
        '<p>'+(state.notes.length===0 ? 'メモがまだありません。「追加」からフローかメモを作りましょう。' : '条件に合うメモが見つかりません。')+'</p>' +
        '<button class="btn primary" onclick="App.goTab(\'add\')">'+ICONS.add+' 新しいメモを作る</button></div>';
    } else {
      var rows = list.map(function(n){
        var cat = LN.catById(n.categoryId);
        var tag = cat ? '<span class="tag" style="color:'+cat.hex+'">'+esc(cat.name)+'</span>' : '<span class="tag none">未分類</span>';
        var raw = n.type==='flow' ? (n.nodes||[]).map(function(nd){return nd.text||'';}).join(' / ') : (n.content||'');
        var snippet = LN.plainSnippet(raw) || '(内容なし)';
        var typeIcon = n.type==='flow' ? ICONS.flow : ICONS.memo;
        return '<div class="notecard" onclick="App.openNote(\''+n.id+'\')">' +
          '<div class="typeicon">'+typeIcon+'</div>' +
          '<div class="body"><h3>'+esc(n.title||'(無題)')+'</h3><div class="snippet">'+snippet+'</div>' +
          '<div class="meta">'+tag+'<span class="date">'+LN.fmtDate(n.updatedAt)+'</span></div></div>' +
          '<button class="del" onclick="event.stopPropagation();App.confirmDeleteNote(\''+n.id+'\')">'+ICONS.trash+'</button>' +
        '</div>';
      }).join('');
      main = search + '<div class="notelist">'+rows+'</div>';
    }
    return '<div class="listwrap"><div class="listmain">'+main+'</div>'+sideIndexHtml()+'</div>';
  }
  function wireList(){
    var s = document.getElementById('searchInput');
    if(s) s.addEventListener('input', function(){ state.searchQ=this.value; renderCurrentTab(); });
  }

  // ---------- CHOOSER ----------
  function renderChooser(){
    return '<div class="chooser">' +
      '<button class="choosebtn" onclick="App.createNote(\'flow\')">'+ICONS.flow.replace('class="icon"','')+'<div class="t">フローを作る</div><div class="d">手順・作業の流れを箱と矢印で書く</div></button>' +
      '<button class="choosebtn" onclick="App.createNote(\'memo\')">'+ICONS.memo.replace('class="icon"','')+'<div class="t">メモを書く</div><div class="d">手順ではない、ふつうの文章メモ</div></button>' +
    '</div>';
  }

  // ---------- CATEGORIES ----------
  var newCatColor = LN.PALETTE[5].hex;
  function renderCategories(){
    var cats = state.categories.slice().sort(byOrder);
    var rows = cats.length===0 ? '<div class="hint" style="margin-bottom:16px;">カテゴリがまだありません。下のフォームから追加できます。</div>' :
      cats.map(function(c,i){
        var count = state.notes.filter(function(n){return n.categoryId===c.id;}).length;
        return '<div class="catrow"><span class="dot" style="background:'+c.hex+'"></span><span class="name">'+esc(c.name)+'</span><span class="count">'+count+'件</span>' +
          '<button class="iconbtn" '+(i===0?'disabled':'')+' onclick="App.moveCategory(\''+c.id+'\',-1)">▲</button>' +
          '<button class="iconbtn" '+(i===cats.length-1?'disabled':'')+' onclick="App.moveCategory(\''+c.id+'\',1)">▼</button>' +
          '<button class="iconbtn" onclick="App.confirmDeleteCategory(\''+c.id+'\',\''+esc(c.name).replace(/'/g,"\\'")+'\')">'+ICONS.trash+'</button></div>';
      }).join('');
    var swatches = LN.PALETTE.map(function(p){
      return '<button type="button" class="swatch'+(p.hex===newCatColor?' selected':'')+'" style="background:'+p.hex+'" title="'+p.name+'" onclick="App.pickCatColor(\''+p.hex+'\')"></button>';
    }).join('');
    return '<div class="section-title">カテゴリ一覧</div>' + rows +
      '<div class="card" style="margin-top:18px;">' +
        '<div class="field"><label for="catName">新しいカテゴリ名</label><input type="text" id="catName" placeholder="例:開店準備"></div>' +
        '<div class="field"><label>色</label><div class="palette">'+swatches+'</div></div>' +
        '<button class="btn primary block" onclick="App.addCategory()">'+ICONS.add+' カテゴリを追加</button>' +
      '</div>';
  }

  // ---------- SETTINGS ----------
  function renderSettings(){
    var synced = window.LNSync && window.LNSync.isConfigured();
    var modeLabel = state.storageMode==='db' ? 'このアーティファクトのアカウント(どの端末からでも同じデータ)'
      : (synced ? 'この端末 + Googleドライブ(他の端末とも同じデータ)' : 'この端末のみ(他の端末とは同期されません)');
    return '<div class="section-title">データの保存先</div><div class="card">'+modeLabel+'</div>' +
      (window.LNSync ? window.LNSync.renderSettingsCard() : '') +
      '<div class="section-title">バックアップ</div>' +
      '<div class="card"><p class="hint" style="margin:0 0 12px;">大事なメモなので、ときどきバックアップの保存をおすすめします。</p>' +
        '<div class="row"><button class="btn block" onclick="App.exportBackup()">エクスポート</button><button class="btn block" onclick="document.getElementById(\'importInput\').click()">インポート</button></div>' +
        '<input type="file" id="importInput" accept="application/json" hidden></div>' +
      '<div class="section-title">データの削除</div>' +
      '<div class="card"><p class="hint" style="margin:0 0 12px;">すべてのメモとカテゴリを削除します。元に戻せません。</p>' +
        '<button class="btn danger block" onclick="App.confirmWipeAll()">'+ICONS.trash+' すべてのデータを削除</button></div>';
  }
  function wireSettings(){
    var imp = document.getElementById('importInput');
    if(!imp) return;
    imp.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = async function(){
        try{
          var payload = JSON.parse(reader.result);
          var ok = await LN.confirm('現在のメモとカテゴリを、バックアップの内容で上書きします。よろしいですか?');
          if(!ok) return;
          await App.importBackup(payload);
          LN.showToast('データを復元しました');
        }catch(err){ LN.showToast('ファイルの読み込みに失敗しました','error'); }
      };
      reader.readAsText(file);
      imp.value='';
    });
  }

  window.App = window.App || {};
  Object.assign(window.App, {
    renderCurrentTab: renderCurrentTab,
    goTab: function(tab){ state.tab = tab; state.openId = tab==='add'||tab==='list' ? null : state.openId; renderCurrentTab(); },
    setFilter: function(id){ state.filterCat = id; renderCurrentTab(); },
    openNote: function(id){
      var n = state.notes.find(function(x){return x.id===id;});
      if(!n) return;
      state.openId = id;
      state.tab = n.type==='flow' ? 'flow' : 'memo';
      renderCurrentTab();
    },
    confirmDeleteNote: async function(id, andGoList){
      var n = state.notes.find(function(x){return x.id===id;});
      var ok = await LN.confirm('「'+(n?(n.title||'無題'):'このメモ')+'」を削除します。よろしいですか?');
      if(!ok) return;
      await LN.deleteNoteById(id);
      LN.showToast('削除しました');
      if(andGoList) App.goTab('list'); else renderCurrentTab();
    },
    createNote: function(type){
      var order = Math.max(0, Math.max.apply(null, state.notes.map(function(n){return n.order||0;}).concat([0]))) + 1;
      var base = {type:type, title:'', categoryId: state.filterCat!=='all'?state.filterCat:'', order:order};
      if(type==='flow') base.nodes = []; else base.content='';
      LN.upsertNote(base).then(function(id){
        state.openId = id; state.tab = type;
        renderCurrentTab();
      });
    },
    pickCatColor: function(hex){ newCatColor = hex; renderCurrentTab(); },
    addCategory: function(){
      var nameEl = document.getElementById('catName');
      var name = nameEl.value.trim();
      if(!name){ LN.showToast('カテゴリ名を入力してください','error'); return; }
      var order = Math.max(0, Math.max.apply(null, state.categories.map(function(c){return c.order||0;}).concat([0]))) + 1;
      LN.upsertCategory({name:name, hex:newCatColor, order:order}).then(function(){ LN.showToast('カテゴリを追加しました'); renderCurrentTab(); });
    },
    moveCategory: function(id, dir){
      var list = state.categories.slice().sort(byOrder);
      var idx = list.findIndex(function(c){return c.id===id;});
      var sw = idx+dir;
      if(idx<0||sw<0||sw>=list.length) return;
      var a=list[idx], b=list[sw]; var oa=a.order||0, ob=b.order||0;
      LN.upsertCategory(Object.assign({},a,{order:ob}));
      LN.upsertCategory(Object.assign({},b,{order:oa}));
    },
    confirmDeleteCategory: async function(id,name){
      var ok = await LN.confirm('カテゴリ「'+name+'」を削除します。このカテゴリのメモは未分類になります。よろしいですか?');
      if(!ok) return;
      await LN.deleteCategoryById(id);
      LN.showToast('カテゴリを削除しました'); renderCurrentTab();
    },
    exportBackup: async function(){
      var payload = {app:'leafnote', version:1, exportedAt: LN.nowIso(), updatedAt: LN.nowIso(),
                     notes: state.notes, categories: state.categories, settings: state.settings,
                     deleted: LN.getTombstones ? LN.getTombstones() : {}};
      var fname = 'leafnote-backup-'+LN.nowStamp()+'.json';
      var text = JSON.stringify(payload,null,2);
      if(state.downloadsCap){
        try{ await state.downloadsCap.save({filename:fname, data:text}); LN.showToast('バックアップを保存しました'); }
        catch(e){ if(e && e.code==='declined') return; LN.showToast('保存に失敗しました','error'); }
        return;
      }
      try{
        var blob = new Blob([text], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fname; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
        LN.showToast('バックアップを保存しました');
      }catch(e2){ LN.showToast('保存に失敗しました','error'); }
    },
    importBackup: async function(payload){
      var catMap = {};
      if(state.storageMode==='db'){
        for(var i=0;i<state.notes.length;i++){ await state.dbCap.collection('notes').doc(state.notes[i].id).delete(); }
        for(var j=0;j<state.categories.length;j++){ await state.dbCap.collection('categories').doc(state.categories[j].id).delete(); }
        var cats = payload.categories||[];
        for(var k=0;k<cats.length;k++){ var c=Object.assign({},cats[k]); var oldId=c.id; delete c.id; var ref=await state.dbCap.collection('categories').add(c); if(oldId) catMap[oldId]=ref.id; }
        var notes = payload.notes||[];
        for(var m=0;m<notes.length;m++){ var n=Object.assign({},notes[m]); delete n.id; if(n.categoryId && catMap[n.categoryId]) n.categoryId=catMap[n.categoryId]; await state.dbCap.collection('notes').add(n); }
        if(payload.settings) await state.dbCap.doc('settings/print').set(Object.assign({},LN.DEFAULT_SETTINGS,payload.settings));
      } else {
        state.categories = payload.categories||[]; state.notes = payload.notes||[];
        state.settings = Object.assign({}, LN.DEFAULT_SETTINGS, payload.settings||{});
        if(payload.deleted && LN.setTombstones) LN.setTombstones(payload.deleted);
        (function(){ try{ localStorage.setItem('leafnote_data_v2', JSON.stringify({notes:state.notes,categories:state.categories,settings:state.settings})); }catch(e){} })();
        if(window.LNSync) window.LNSync.schedulePush();
      }
      state.tab='list'; renderCurrentTab();
    },
    confirmWipeAll: async function(){
      var ok1 = await LN.confirm('本当にすべてのメモとカテゴリを削除しますか?この操作は元に戻せません。');
      if(!ok1) return;
      var ok2 = await LN.confirm('もう一度確認します。全データを削除してよろしいですか?');
      if(!ok2) return;
      (async function(){
        if(state.storageMode==='db'){
          for(var i=0;i<state.notes.length;i++){ await state.dbCap.collection('notes').doc(state.notes[i].id).delete(); }
          for(var j=0;j<state.categories.length;j++){ await state.dbCap.collection('categories').doc(state.categories[j].id).delete(); }
        } else {
          if(LN.markDeleted){ state.notes.forEach(function(n){ LN.markDeleted(n.id, n); }); state.categories.forEach(function(c){ LN.markDeleted(c.id, c); }); }
          state.notes=[]; state.categories=[];
          try{ localStorage.removeItem('leafnote_data_v2'); }catch(e){}
          if(window.LNSync) window.LNSync.schedulePush();
        }
        LN.showToast('すべてのデータを削除しました'); renderCurrentTab();
      })();
    }
  });
})();
</script>
<script>
(function(){
  "use strict";
  var LN = window.LN, state = LN.state, ICONS = LN.ICONS, esc = LN.esc;
  var BASE_PX = 3.2; // px per mm at zoom=1
  var GAP_MM = 9;
  var HOLD_MS = 220, MOVE_TH = 13;

  var FE = null; // {note, zoom, panX, panY, editingNodeId}
  // 指が2本乗っているあいだは「紙をつまんでいる」状態。箱の移動やスワイプ作成は
  // いったん止めて、拡大と移動だけを受け付ける。指が全部離れるまで戻さない。
  var gestureActive = false;

  function mmToPx(mm){ return mm*BASE_PX; }
  function pxToMm(px){ return px/BASE_PX; }
  // Paper geometry comes from LN so the editor and the printer can never disagree.
  var fullWidthMm = LN.fullWidthMm, pageHeightMm = LN.pageHeightMm;
  var nodeW = LN.nodeWmm, nodeH = LN.nodeHmm, dividerW = LN.dividerWmm;
  function nodesArr(){ return FE.note.nodes || (FE.note.nodes=[]); }
  function edgesArr(){ return FE.note.edges || (FE.note.edges=[]); }
  function dividersArr(){ return FE.note.dividers || (FE.note.dividers=[]); }
  function nodeById(id){ return nodesArr().find(function(n){return n.id===id;}); }

  // A wrapped arrow-label callout needs a certain amount of vertical room to
  // stay fully inside the gap between its two boxes; otherwise it paints partly
  // underneath them and gets hidden (their background is opaque, drawn after
  // the arrow layer). Rather than shrink or truncate the label, push the lower
  // box (and everything below it) down just enough to fit it — the arrow
  // "gets longer" automatically when a long/crowded label needs the space.
  // (Shared logic lives in LN.ensureFlowEdgeGaps so the print engine, which
  // has no access to this editor's FE state, can apply the same self-healing.)
  function ensureGapForEdgeLabel(e){
    return LN.ensureFlowEdgeGaps({nodes:nodesArr(), edges:[e], dividers:dividersArr()});
  }
  function ensureAllEdgeGaps(){
    var a = LN.ensureFlowEdgeGaps(FE.note);
    var b = LN.snapOutOfDeadZones(FE.note);
    return a || b;
  }

  // The steps that a box flows down into. Flicking down from the same box twice used to
  // drop the second step on top of the first; instead they share one row, so the row is
  // split into as many columns as there are steps and they sit side by side.
  function downChildrenOf(parentId){
    var parent = nodeById(parentId);
    var ids = edgesArr().filter(function(e){ return e.vertical && e.from===parentId; }).map(function(e){ return e.to; });
    return nodesArr().filter(function(n){ return ids.indexOf(n.id)>=0 && (!parent || n.y >= parent.y); });
  }
  function childEdgesOf(id){ return edgesArr().filter(function(e){ return e.vertical && e.from===id; }); }
  function hasNextSteps(id){ return childEdgesOf(id).length > 0; }
  function incomingCount(id){ return edgesArr().filter(function(e){ return e.vertical && e.to===id; }).length; }
  // Everything that hangs below a box, so a column can be moved together with the steps
  // that belong to it. A step several columns feed into (a convergence) belongs to no
  // single column, so it is left where it is.
  function descendantsOf(rootId){
    var seen={}, out=[], q=[rootId];
    seen[rootId]=true;
    while(q.length){
      var id=q.shift();
      childEdgesOf(id).forEach(function(e){
        if(seen[e.to]) return;
        seen[e.to]=true;
        q.push(e.to);
        if(incomingCount(e.to)>1) return;
        var n=nodeById(e.to);
        if(n) out.push(n);
      });
    }
    return out;
  }
  function shiftNodeX(n, dx){
    if(!dx) return;
    n.x = LN.clamp(n.x + dx, 0, Math.max(0, fullWidthMm()-nodeW(n)));
    (n.annotations||[]).forEach(function(a){ a.x = LN.clamp(a.x + dx, 0, Math.max(0, fullWidthMm()-14)); });
  }
  function relayoutRow(parentId){
    var kids = downChildrenOf(parentId).filter(function(k){ return k.full; });
    if(!kids.length) return;
    var cols = kids.length;
    var rowY = Math.min.apply(null, kids.map(function(k){ return k.y; }));
    kids.forEach(function(k, i){
      var nx = LN.colXMm(i, cols), dx = nx - k.x;
      var kidIds = kids.map(function(x){ return x.id; });
      k.cols = cols; k.y = rowY;
      shiftNodeX(k, dx);
      k.x = nx;
      // The steps under this column travel with it, so a branch that continues further
      // down stays lined up under its own heading.
      if(dx) descendantsOf(k.id).forEach(function(d){ if(kidIds.indexOf(d.id)<0) shiftNodeX(d, dx); });
    });
  }

  function persistFlow(){
    // geomV2 must be saved too: it records that this note has been brought onto the
    // current paper geometry, so the one-time migration never runs against itself.
    LN.patchNote(FE.note.id, {nodes: nodesArr(), edges: edgesArr(), dividers: dividersArr(), title: FE.note.title, categoryId: FE.note.categoryId, titleNodeId: FE.note.titleNodeId, geomV2: !!FE.note.geomV2});
  }

  // Keeps the canvas heading box in sync with the flow's name (one-way: name -> box).
  // Creates the heading node the first time a title is set, and updates its text
  // whenever the title changes. Returns true if something changed (caller should persist).
  function syncTitleNode(){
    var tid = FE.note.titleNodeId;
    var node = tid ? nodeById(tid) : null;
    var titleText = (FE.note.title||'').trim();
    if(!node){
      if(!titleText) return false;
      // The heading always spans the full width, left-aligned like a page title.
      var others = nodesArr();
      var headH = 11, shift = headH + GAP_MM; // a title line, not a full-size step box
      var y = 0;
      if(others.length){
        // Make room above existing content. If there isn't any (e.g. a node already
        // sits at the very top), nudge everything else down just enough, keeping
        // their relative layout intact.
        var minY = Math.min.apply(null, others.map(function(n){return n.y;}));
        if(minY < y + shift) LN.shiftContentBelow(FE.note, -1e9, (y+shift)-minY);
      }
      node = {id:LN.uid(), x:0, y:y, h:headH, full:true, text:FE.note.title||'', isTitleNode:true};
      nodesArr().unshift(node);
      FE.note.titleNodeId = node.id;
      return true;
    }
    var changed=false;
    if(node.text !== (FE.note.title||'')){ node.text = FE.note.title||''; changed=true; }
    if(!node.isTitleNode){ node.isTitleNode=true; changed=true; }
    if(!node.full){ node.full=true; changed=true; }
    if((node.h||0) > 12){ node.h=11; changed=true; }
    // The title is its own frame kind now, so it no longer borrows the "heading" style.
    if(node.style){ delete node.style; changed=true; }
    if(node.x!==0){ node.x=0; changed=true; }
    return changed;
  }

  function openFlowEditor(id){
    var n = state.notes.find(function(x){return x.id===id;});
    if(!n){ App.goTab('list'); return; }
    if(FE && FE.releaseGestureHooks) FE.releaseGestureHooks();
    FE = {note: JSON.parse(JSON.stringify(n)), zoom:1, panX:0, panY:0, editingNodeId:null, selectedNodeId:null, selectedAnnoId:null, lastTap:null};
    if(!FE.note.nodes) FE.note.nodes=[];
    if(!FE.note.edges) FE.note.edges=[];
    if(!FE.note.dividers) FE.note.dividers=[];
    // Bring layouts from older versions onto the current paper geometry.
    var normalized = LN.normalizeFlowGeometry(FE.note);
    document.getElementById('topbar').innerHTML =
      '<button class="backbtn" onclick="App.closeEditor()">'+ICONS.back+'</button>' +
      '<input class="titlein" id="flowTitle" placeholder="フローの名前" value="'+esc(FE.note.title||'')+'">' +
      '<button class="tbaction" onclick="App.confirmDeleteNote(\''+FE.note.id+'\', true)">削除</button>';
    document.getElementById('flowTitle').addEventListener('change', function(){ if(!FE) return; FE.note.title=this.value; syncTitleNode(); persistFlow(); renderCanvas(); });

    var catOpts = '<option value="">未分類</option>' + state.categories.slice().sort(LN.byOrder).map(function(c){
      return '<option value="'+c.id+'"'+(c.id===(FE.note.categoryId||'')?' selected':'')+'>'+esc(c.name)+'</option>';
    }).join('');

    document.body.classList.add('canvasLock');
    var view = document.getElementById('view');
    view.className='flush';
    view.innerHTML =
      '<div style="display:flex; flex-direction:column; height:100%;">' +
      '<div class="canvasToolbar"><select id="flowCat" style="border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface-2);color:var(--ink);font-size:12px;">'+catOpts+'</select>' +
        '<span class="spacer" style="flex:1;"></span>' +
        '<div class="zoombtns"><button class="zoombtn" onclick="App.toggleHint()" title="操作のヒント">?</button><button class="zoombtn" onclick="App.addDivider()" title="区切り線を追加">―</button><button class="zoombtn" onclick="App.flowZoom(-1)">'+ICONS.zout+'</button><button class="zoombtn" onclick="App.flowZoom(1)">'+ICONS.zin+'</button></div></div>' +
      // Shown the first time only — after that the "?" button brings it back, so the
      // paper isn't permanently squeezed by a reference card.
