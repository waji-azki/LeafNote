      }).map(function(id){ return map[id]; });
    }

    var ls = local.settings || {}, rs = remote.settings || {};
    return {
      app: 'leafnote', version: 1, updatedAt: nowIso(),
      notes: mergeList(local.notes, remote.notes),
      categories: mergeList(local.categories, remote.categories),
      settings: ts(ls.updatedAt) >= ts(rs.updatedAt) ? ls : rs,
      deleted: pruneDeleted(deleted)
    };
  }

  function localPayload(){
    var s = LN().state;
    return {
      app: 'leafnote', version: 1, updatedAt: nowIso(),
      notes: s.notes || [], categories: s.categories || [],
      settings: s.settings || {}, deleted: LN().getTombstones()
    };
  }

  function applyMerged(m){
    var ln = LN(), s = ln.state;
    s.notes = m.notes || [];
    s.categories = m.categories || [];
    s.settings = Object.assign({}, ln.DEFAULT_SETTINGS, m.settings || {});
    ln.setTombstones(m.deleted || {});
    ln.saveLocalQuiet();
    if(s.ready && window.App && !inEditor()) window.App.renderCurrentTab();
  }

  // ---------- 同期 ----------
  function errText(e){
    var m = String((e && e.message) || e);
    if(m === 'no-client-id') return 'クライアントIDが未設定です';
    if(m === 'needs-tap') return '「今すぐ同期」で送れます';
    if(m === 'offline') return 'ネットにつながっていません';
    if(m.indexOf('auth') >= 0 || m === 'popup_closed' || m === 'popup_failed_to_open') return 'Googleへの接続が必要です';
    if(m.indexOf('drive-401') >= 0 || m.indexOf('drive-403') >= 0) return 'アクセスが許可されていません';
    if(m.indexOf('drive-') >= 0) return 'ドライブでエラー(' + m.replace('drive-','') + ')';
    return '同期できませんでした';
  }

  function setStatus(t){ statusText = t; refreshCard(); updateBanner(); }

  function syncNow(interactive){
    if(!cfg.clientId){ setStatus('未設定'); return Promise.resolve(); }
    if(!navigator.onLine){ setStatus('オフライン(つながったら同期します)'); return Promise.resolve(); }
    // 自分から画面を開かない設定のときは、有効なトークンが残っているときだけ動く
    if(!interactive && !cfg.autoConnect && !(token && Date.now() < tokenExp - 60000)){
      setStatus(dirty ? '送れていない変更があります' : '同期するにはタップ');
      return Promise.resolve();
    }
    if(syncing) return Promise.resolve();
    syncing = true; dirty = false; interactiveRun = !!interactive; setStatus('同期中…');
    return downloadRemote(interactive).then(function(remote){
      var merged = mergePayloads(localPayload(), remote);
      if(!inEditor()) applyMerged(merged); else dirty = true;
      return uploadPayload(JSON.stringify(merged));
    }).then(function(){
      cfg.lastSync = nowIso(); saveCfg();
      setStatus('同期済み');
      if(interactive && LN().showToast) LN().showToast('Googleドライブと同期しました');
    }).catch(function(e){
      dirty = true;
      setStatus(errText(e));
      if(interactive && LN().showToast) LN().showToast(errText(e), 'error');
    }).then(function(){ syncing = false; interactiveRun = false; updateBanner(); });
  }

  function schedulePush(){
    if(!cfg.clientId) return;
    dirty = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ syncNow(false); }, PUSH_DELAY);
  }

  // ---------- 設定画面 ----------
  function esc(s){ return LN() ? LN().esc(s) : String(s||''); }

  function renderSettingsCard(){
    var connected = !!cfg.clientId;
    var last = cfg.lastSync ? new Date(cfg.lastSync).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'まだ同期していません';
    var html = '<div class="section-title">Googleドライブ同期</div><div class="card" id="driveCard">';
    html += '<div class="row" style="justify-content:space-between; align-items:center; gap:10px;">' +
              '<div><div style="font-weight:700;">' + esc(statusText) + '</div>' +
              '<div class="hint" style="margin:2px 0 0;">最終同期: ' + esc(last) + '</div></div>' +
            '</div>';
    if(connected){
      var live = token && Date.now() < tokenExp - 60000;
      html += '<div class="row" style="margin-top:12px;">' +
                '<button class="btn primary block" onclick="LNSync.syncNow(true)">今すぐ同期</button>' +
                '<button class="btn block" onclick="LNSync.disconnect()">接続を解除</button></div>' +
              '<p class="hint" style="margin:10px 0 0;">' +
                (live ? 'いまはつながっています。書き換えると自動でドライブに保存されます。'
                      : 'Googleの許可は1時間ほどで切れます。切れたあとは「今すぐ同期」を押したときにつなぎ直します。') +
              '</p>' +
              '<label class="row" style="margin-top:12px; align-items:flex-start; gap:10px;">' +
                '<input type="checkbox" id="driveAuto"' + (cfg.autoConnect ? ' checked' : '') +
                ' onchange="LNSync.setAutoConnect(this.checked)" style="margin-top:3px; flex:none;">' +
                '<span style="font-size:13px;">アプリを開いたときに自動でつなぎ直す' +
                '<span class="hint" style="display:block; margin:2px 0 0;">Googleの画面が出ることがあります。切っておくと、起動のじゃまになりません。</span></span>' +
              '</label>';
    } else {
      html += '<p class="hint" style="margin:10px 0 12px;">Googleドライブにつなぐと、スマホでもパソコンでも同じメモが使えます。' +
              'つなぐには自分のGoogleでクライアントIDを1回だけ作ります(手順書を見てください)。</p>' +
              '<div class="field"><label for="driveClientId">クライアントID</label>' +
              '<input type="text" id="driveClientId" placeholder="000000-xxxxx.apps.googleusercontent.com" autocapitalize="off" autocorrect="off" spellcheck="false"></div>' +
              '<button class="btn primary block" onclick="LNSync.connect()">Googleドライブに接続</button>';
    }
    html += '</div>';
    if(installPrompt){
      html += '<div class="section-title">ホーム画面に追加</div><div class="card">' +
              '<p class="hint" style="margin:0 0 12px;">アプリのように起動できるようになります。</p>' +
              '<button class="btn block" onclick="LNSync.install()">ホーム画面に追加</button></div>';
    }
    return html;
  }

  // 未送信の変更があるのに勝手にGoogleの画面を開かない、という約束の代わりに、
  // 画面の下に小さく「タップして同期」を出す。押すのは利用者。
  function updateBanner(){
    var el = document.getElementById('lnSyncBar');
    var show = !!cfg.clientId && dirty && !syncing && !inEditor() && navigator.onLine;
    if(!show){ if(el) el.remove(); return; }
    if(!el){
      el = document.createElement('button');
      el.id = 'lnSyncBar';
      el.type = 'button';
      el.setAttribute('style',
        'position:fixed; left:50%; transform:translateX(-50%); z-index:40;' +
        'bottom:calc(64px + env(safe-area-inset-bottom,0px));' +
        'border:1px solid var(--line); background:var(--surface); color:var(--ink);' +
        'border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700;' +
        'box-shadow:var(--shadow); font-family:inherit;');
      el.onclick = function(){ syncNow(true); };
      document.body.appendChild(el);
    }
    el.textContent = '↑ タップしてドライブに保存';
  }

  function refreshCard(){
    var card = document.getElementById('driveCard');
    if(!card || !card.parentNode) return;
    var s = LN() && LN().state;
    if(!s || s.tab !== 'settings') return;
    if(window.App && window.App.renderCurrentTab) window.App.renderCurrentTab();
  }

  var Sync = {
    mergePayloads: mergePayloads,
    schedulePush: schedulePush,
    syncNow: syncNow,
    renderSettingsCard: renderSettingsCard,
    isConfigured: function(){ return !!cfg.clientId; },
    status: function(){ return statusText; },
    hasLiveToken: function(){ return !!(token && Date.now() < tokenExp - 60000); },
    setAutoConnect: function(on){ cfg.autoConnect = !!on; saveCfg(); },
    connect: function(){
      var el = document.getElementById('driveClientId');
      var id = (el && el.value || '').trim();
      if(!/\.apps\.googleusercontent\.com$/.test(id)){
        LN().showToast('クライアントIDの形式が違うようです', 'error'); return;
      }
      cfg.clientId = id; cfg.fileId = ''; saveCfg();
      tokenClient = null; token = null;
      setStatus('接続中…');
      ensureToken(true).then(function(){ return syncNow(true); })
        .catch(function(e){ setStatus(errText(e)); LN().showToast(errText(e), 'error'); });
    },
    disconnect: function(){
      LN().confirm('Googleドライブとの接続を解除します。ドライブ上のファイルは残ります。よろしいですか?').then(function(ok){
        if(!ok) return;
        try{ if(token && window.google) window.google.accounts.oauth2.revoke(token, function(){}); }catch(e){}
        cfg = {clientId:'', fileId:'', lastSync:'', granted:false, autoConnect:false}; saveCfg();
        clearToken();
        token = null; tokenExp = 0; tokenClient = null;
        setStatus('未設定');
        LN().showToast('接続を解除しました');
      });
    },
    install: function(){
      if(!installPrompt) return;
      installPrompt.prompt();
      installPrompt.userChoice.then(function(){ installPrompt = null; refreshCard(); });
    }
  };
  window.LNSync = Sync;

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); installPrompt = e; refreshCard();
  });
  window.addEventListener('online', function(){ if(dirty) syncNow(false); });
  document.addEventListener('visibilitychange', function(){
    if(!cfg.clientId) return;
    if(document.visibilityState === 'visible' && !inEditor()) syncNow(false);
    if(document.visibilityState === 'hidden' && dirty) syncNow(false);
  });

  // アプリの起動が終わったら1回だけ同期する
  (function waitReady(tries){
    if(window.LN && window.LN.state && window.LN.state.ready){
      if(cfg.clientId){
        syncNow(false);
        // 画面を行き来しても「タップして同期」の出し入れが追いつくように見張る
        setInterval(updateBanner, 2500);
      }
      return;
    }
    if(tries > 80) return;
    setTimeout(function(){ waitReady(tries + 1); }, 200);
  })(0);
})();
</script>
</body>
