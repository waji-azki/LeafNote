      '<div class="canvasHint" id="canvasHint"'+(state.settings.hintSeen ? ' hidden' : '')+'>↓スワイプで次の工程(同じ箱から2回目以降は横並び)・斜め横スワイプで枝分かれ・箱や補足をタップすると上に H(枠) ✥(移動) +(補足) ✕(削除)・見出しはダブルタップで枠変更・2本指で拡大/縮小と紙の移動・矢印は○を左右にドラッグで位置調整<button class="hintClose" onclick="App.toggleHint()" title="閉じる">✕</button></div>' +
      '<div class="canvasViewportOuter"><div class="canvasViewport" id="canvasViewport"><div class="canvasWorld" id="canvasWorld"></div></div></div>' +
      '<button class="canvasFab" onclick="App.addFreeNode()">'+ICONS.plus+'</button>' +
      '</div>';
    document.getElementById('flowCat').addEventListener('change', function(){ FE.note.categoryId=this.value; persistFlow(); });
    updateCanvasViewportWidth();
    FE.panY = mmToPx(state.settings.holeMm||16)*FE.zoom;
    clampPan();
    wireViewportPan();
    // When the keyboard opens (or the assist bar appears), keep the box being edited in
    // the part of the screen that is still visible.
    LN.onKeyboardGeometry = function(){ if(FE && FE.editingNodeId) bringNodeIntoView(FE.editingNodeId); };
    if(window.visualViewport && !window.__lnVvHooked){
      window.__lnVvHooked = true;
      window.visualViewport.addEventListener('resize', function(){ if(LN.onKeyboardGeometry) LN.onKeyboardGeometry(); });
    }
    var titleSynced = (FE.note.title||'').trim() ? syncTitleNode() : false;
    renderCanvas();
    if(titleSynced || normalized) persistFlow();
    if(!state.settings.hintSeen) LN.saveSettingsQuiet({hintSeen:true});
    if(nodesArr().length===0){ setTimeout(function(){ addFreeNode(true); }, 50); }
  }

  function toggleHint(){
    var el = document.getElementById('canvasHint');
    if(el) el.hidden = !el.hidden;
  }

  function applyWorldTransform(){
    var w = document.getElementById('canvasWorld');
    if(w) w.style.transform = 'translate('+FE.panX+'px,'+FE.panY+'px) scale('+FE.zoom+')';
  }

  // The editing area is the sheet itself: as wide as the paper (never wider than the
  // screen), with the paper's left edge pinned to the left of the view. Because world
  // x=0 is the printable area's left edge, the paper starts at world -marginMm, so the
  // pan offset carries exactly that margin — what you edit sits where it will print.
  function updateCanvasViewportWidth(){
    var vp = document.getElementById('canvasViewport');
    if(!vp) return;
    var outer = vp.parentElement;
    var avail = outer ? outer.getBoundingClientRect().width : mmToPx(86)*FE.zoom;
    vp.style.width = Math.min(avail, paperWpx()) + 'px';
  }
  function paperWpx(){ return mmToPx(state.settings.paperW||86)*FE.zoom; }
  function marginPx(){ return mmToPx(state.settings.marginMm||3)*FE.zoom; }
  // Horizontal panning is clamped to the paper's edges (and locked when the whole width
  // is visible); vertical panning is free, since a flow grows downwards across sheets.
  function clampPan(){
    var vp = document.getElementById('canvasViewport');
    if(!vp) return;
    var vw = vp.getBoundingClientRect().width, pw = paperWpx();
    if(pw <= vw + 0.5) FE.panX = marginPx() + (vw - pw)/2;
    else FE.panX = LN.clamp(FE.panX, marginPx() - (pw - vw), marginPx());
    FE.panY = Math.min(FE.panY, mmToPx(state.settings.holeMm||16)*FE.zoom);
  }

  function rectOf(node){ return {x:mmToPx(node.x), y:mmToPx(node.y), w:mmToPx(nodeW(node)), h:mmToPx(nodeH(node))}; }
  function rectEdgePoint(rx,ry,rw,rh,tx,ty){
    var cx=rx+rw/2, cy=ry+rh/2, dx=tx-cx, dy=ty-cy;
    if(dx===0&&dy===0) return {x:cx,y:cy};
    var hw=rw/2, hh=rh/2;
    var sx = dx!==0 ? hw/Math.abs(dx) : Infinity;
    var sy = dy!==0 ? hh/Math.abs(dy) : Infinity;
    var s = Math.min(sx,sy);
    return {x:cx+dx*s, y:cy+dy*s};
  }

  function annoAnchor(a){ return {x: mmToPx(a.x), y: mmToPx(a.y)+10}; }

  // Draws the physical sheets behind the content: each one with its punch-hole strip,
  // the same 5mm grid the printer uses, and a visible edge where one sheet ends and the
  // next begins. Editing then happens literally on the pages that will come out.
  function renderSheets(contentMaxYmm){
    var s = state.settings;
    var paperW = s.paperW||86, paperH = s.paperH||128, holeMm = s.holeMm||16, marginMm = s.marginMm||3, gridMm = s.gridMm||5;
    var pageH = pageHeightMm();
    var pages = Math.max(1, LN.pageIndexOf(contentMaxYmm)+1);
    var html = '';
    for(var k=0;k<pages;k++){
      var topMm = LN.bandTopMm(k) - holeMm;  // this sheet's own top edge, in world mm
      var leftMm = -marginMm;                // sheet's left edge
      var holes = '';
      for(var i=0;i<9;i++) holes += '<span></span>';
      // The grid starts at the sheet's own corner, exactly as the printed page does.
      html += '<div class="sheetGuide" style="left:'+mmToPx(leftMm)+'px; top:'+mmToPx(topMm)+'px; width:'+mmToPx(paperW)+'px; height:'+mmToPx(paperH)+'px; background-size:'+mmToPx(gridMm)+'px '+mmToPx(gridMm)+'px; background-position:0 0;">' +
        '<div class="sheetHoles" style="height:'+mmToPx(holeMm)+'px;">'+holes+'</div>' +
        '<div class="sheetEnd" style="top:'+mmToPx(holeMm+pageH)+'px;"></div>' +
        '<div class="sheetNo">'+(k+1)+'枚目</div>' +
        '</div>';
    }
    return {html:html, pages:pages};
  }

  function renderCanvas(){
    var world = document.getElementById('canvasWorld');
    if(!world) return;
    applyWorldTransform();
    if(ensureAllEdgeGaps()) persistFlow();
    var nodes = nodesArr(), edges = edgesArr(), dividers = dividersArr();
    var maxYmm=0;
    nodes.forEach(function(n){
      maxYmm=Math.max(maxYmm, n.y+nodeH(n));
      (n.annotations||[]).forEach(function(a){ maxYmm=Math.max(maxYmm, a.y+LN.annoHeightMm(a)); });
    });
    dividers.forEach(function(d){ maxYmm=Math.max(maxYmm, d.y); });
    var sheets = renderSheets(maxYmm);
    var svgW = Math.max(mmToPx((state.settings.paperW||86)), 400);
    var svgH = Math.max(mmToPx(maxYmm+40), mmToPx(sheets.pages*pageHeightMm()));
    world.style.width = svgW+'px'; world.style.height = svgH+'px';

    var svg = '<svg width="'+svgW+'" height="'+svgH+'"><defs>' +
      '<marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker>' +
      '<marker id="annoArrowhead" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#8a8677"/></marker>' +
      '</defs>';
    var labels = '';
    var handles = '';   // 矢印を左右に動かすためのつまみ(画面だけ・印刷には出ない)
    edges.forEach(function(e){
      var a = nodeById(e.from), b = nodeById(e.to);
      if(!a||!b) return;
      var ra=rectOf(a), rb=rectOf(b);
      var p1, p2;
      if(e.vertical){
        // A down-swipe-created arrow runs straight down from the point the user actually
        // started dragging (not a geometric center-to-center line), so it matches the
        // handwritten mental model instead of jumping to the box's midpoint.
        var aw=nodeW(a), ah=nodeH(a), bw=nodeW(b), bh=nodeH(b);
        var lo=Math.max(a.x,b.x)+2, hi=Math.min(a.x+aw,b.x+bw)-2;
        var axmm = (typeof e.anchorX==='number') ? e.anchorX : (a.x+aw/2);
        if(lo>hi){ lo=hi=axmm; }
        axmm = LN.clamp(axmm, lo, hi);
        var belowsource = b.y >= a.y;
        var y1mm = belowsource ? a.y+ah : a.y;
        var y2mm = belowsource ? b.y : b.y+bh;
        var pxAx = mmToPx(axmm);
        p1 = {x:pxAx, y:mmToPx(y1mm)};
        p2 = {x:pxAx, y:mmToPx(y2mm)};
      } else {
        p1 = rectEdgePoint(ra.x,ra.y,ra.w,ra.h, rb.x+rb.w/2, rb.y+rb.h/2);
        p2 = rectEdgePoint(rb.x,rb.y,rb.w,rb.h, ra.x+ra.w/2, ra.y+ra.h/2);
      }
      // 縦の矢印は掴んで左右に動かせる(補足の位置に合わせたいときのため)。
      // 動かさずに離したときは、今までどおりラベルの編集になる。
      if(e.vertical){
        svg += '<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="transparent" stroke-width="16" style="pointer-events:auto;cursor:ew-resize;" data-edgehit="'+e.id+'"/>';
        var hy = (p1.y+p2.y)/2;
        handles += '<div class="arrowHandle" data-edgehandle="'+e.id+'" style="left:'+p1.x+'px; top:'+hy+'px;" title="左右にドラッグして矢印の位置を調整"></div>';
      } else {
        svg += '<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="transparent" stroke-width="16" style="pointer-events:auto;cursor:pointer;" onclick="App.editEdge(\''+e.id+'\')"/>';
      }
      svg += '<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" style="pointer-events:none;"/>';
      if(e.label){
        var my=(p1.y+p2.y)/2;
        if(e.vertical){
          labels += '<div class="flowArrowLabel vlabel" style="--vx:'+p1.x+'px; top:'+my+'px;" onclick="App.editEdge(\''+e.id+'\')">'+esc(e.label)+'</div>';
        } else {
          var mx=(p1.x+p2.x)/2;
          labels += '<div class="flowArrowLabel" style="left:'+mx+'px; top:'+my+'px;" onclick="App.editEdge(\''+e.id+'\')">'+esc(e.label)+'</div>';
        }
      }
    });
    nodes.forEach(function(n){
      var rn = rectOf(n);
      (n.annotations||[]).forEach(function(a){
        var anchor = annoAnchor(a);
        var p1 = rectEdgePoint(rn.x, rn.y, rn.w, rn.h, anchor.x, anchor.y);
        svg += '<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+anchor.x+'" y2="'+anchor.y+'" stroke="#8a8677" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#annoArrowhead)" style="pointer-events:none;"/>';
      });
    });
    svg += '</svg>';

    var minHpx = mmToPx(LN.MM_PER_NODE_H);
    var nodesHtml = nodes.map(function(n){
      var r = rectOf(n);
      var editing = FE.editingNodeId===n.id;
      var sel = FE.selectedNodeId===n.id ? ' selected' : '';
      // f-plain = a main-flow box: no printed frame, only a faint dashed edit guide.
      var headingCls = ' f-'+LN.frameKindOf(n);
      if(n.isTitleNode && n.frameStyle && n.frameStyle!=='solid') headingCls += ' frame-'+n.frameStyle;
      if(editing){
        var style = 'left:'+r.x+'px; top:'+r.y+'px; width:'+r.w+'px; min-height:'+minHpx+'px;';
        return '<div class="flowNode'+sel+headingCls+'" style="'+style+'" data-id="'+n.id+'"><textarea class="assistTa" id="nodeTa_'+n.id+'">'+esc(n.text||'')+'</textarea></div>';
      }
      var wrapStyle = 'left:'+r.x+'px; top:'+r.y+'px; width:'+r.w+'px; min-height:'+minHpx+'px;';
      var body = LN.renderRichText(n.text||'')||'<span style="color:#999;">(工程名)</span>';
      // All of a box's controls are edit-time chrome that never prints, so they appear
      // only on the box you tapped: H = frame it, ✥ = drag to move, ✕ = delete,
      // + = add a note. No long press needed for any of them.
      // The controls live in a small bar just outside the box, not on its corners: the
      // box's own edges are where swipes start, and a delete button sitting on the
      // bottom-left corner swallowed the downward swipe that makes the next step.
      var ctrls = '';
      if(FE.selectedNodeId===n.id){
        var row = '';
        if(!n.isTitleNode) row += '<button class="nodeBtn styleToggle'+(n.style==='heading'?' active':'')+'" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation(); App.toggleNodeStyle(\''+n.id+'\')" title="枠をつけて強調">H</button>';
        row += '<button class="nodeBtn moveHandle" data-move="'+n.id+'" title="ドラッグで移動">✥</button>';
        row += '<button class="nodeBtn addAnno" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation(); App.addAnnotation(\''+n.id+'\')" title="補足を追加">+</button>';
        row += '<button class="nodeBtn delBtn" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation(); App.deleteNode(\''+n.id+'\')" title="この箱を削除">✕</button>';
        // above the box, unless it is right at the top of a sheet
        var nearTop = (n.y - LN.bandTopMm(LN.pageIndexOf(n.y))) < 8;
        ctrls = '<div class="nodeCtrls'+(nearTop?' below':'')+'">'+row+'</div>';
      }
      return '<div class="flowNodeWrap" style="'+wrapStyle+'">' +
        '<div class="flowNode'+sel+headingCls+'" data-id="'+n.id+'" style="position:static; left:auto; top:auto; width:100%; min-height:'+minHpx+'px;">'+body+'</div>' +
        ctrls +
        '</div>';
    }).join('');

    var annoHtml = nodes.map(function(n){
      return (n.annotations||[]).map(function(a){
        var body = LN.renderAnnotationHtml(a.text||'', a.groups) || '<span style="color:#aaa;">(補足)</span>';
        // A note may use the rest of the printable width — no more 34mm cage that broke
        // "セイロン" into one character per line.
        var maxW = mmToPx(Math.max(20, fullWidthMm()-a.x));
        // Same idea as a box: the selected note carries its own move/delete controls.
        var actrl = '';
        if(FE.selectedAnnoId===a.id){
          actrl = '<div class="nodeCtrls">' +
            '<button class="nodeBtn moveHandle" data-amove="'+a.id+'" data-anode="'+n.id+'" title="ドラッグで移動">✥</button>' +
            '<button class="nodeBtn delBtn" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation(); App.deleteAnnotation(\''+n.id+'\',\''+a.id+'\')" title="この補足を削除">✕</button>' +
            '</div>';
        }
        var aSel = FE.selectedAnnoId===a.id ? ' selected' : '';
        return '<div class="flowAnnotation'+aSel+'" data-node="'+n.id+'" data-anno="'+a.id+'" style="left:'+mmToPx(a.x)+'px; top:'+mmToPx(a.y)+'px; max-width:'+maxW+'px;">'+body+actrl+'</div>';
      }).join('');
    }).join('');

    var divHtml = dividers.map(function(d){
      var dx=mmToPx(d.x), dy=mmToPx(d.y), dw=mmToPx(dividerW(d));
      return '<div class="flowDivider" data-id="'+d.id+'" style="left:'+dx+'px; top:'+dy+'px; width:'+dw+'px;"></div>' +
        '<div class="dividerHandle" data-handle="'+d.id+'" style="left:'+(dx+dw)+'px; top:'+dy+'px;"></div>';
    }).join('');

    world.innerHTML = sheets.html + svg + nodesHtml + annoHtml + divHtml + labels + handles;

    nodes.forEach(function(n){
      var el = world.querySelector('.flowNode[data-id="'+n.id+'"]');
      if(el){
        if(FE.editingNodeId===n.id){
          var ta = el.querySelector('textarea');
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
          ta.addEventListener('input', function(){ autoGrow(n, ta); });
          ta.addEventListener('blur', function(){ commitNodeText(n.id, ta.value); });
          ta.addEventListener('keydown', function(ev){ if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); ta.blur(); } });
          autoGrow(n, ta);
        } else {
          el.addEventListener('pointerdown', function(ev){ onNodePointerDown(ev, n); });
        }
      }
      var mh = world.querySelector('.moveHandle[data-move="'+n.id+'"]');
      if(mh) mh.addEventListener('pointerdown', function(ev){ onMoveHandleDown(ev, n); });
      (n.annotations||[]).forEach(function(a){
        var ael = world.querySelector('.flowAnnotation[data-anno="'+a.id+'"]');
        if(ael) ael.addEventListener('pointerdown', function(ev){ onAnnotationPointerDown(ev, n, a); });
        var amh = world.querySelector('.moveHandle[data-amove="'+a.id+'"]');
        if(amh) amh.addEventListener('pointerdown', function(ev){ onAnnoMoveHandleDown(ev, a); });
      });
    });
    edges.forEach(function(e){
      if(!e.vertical) return;
      var hit = world.querySelector('[data-edgehit="'+e.id+'"]');
      if(hit) hit.addEventListener('pointerdown', function(ev){ onEdgeAnchorDown(ev, e); });
      var grip = world.querySelector('[data-edgehandle="'+e.id+'"]');
      if(grip) grip.addEventListener('pointerdown', function(ev){ onEdgeAnchorDown(ev, e); });
    });
    dividers.forEach(function(d){
      var del = world.querySelector('.flowDivider[data-id="'+d.id+'"]');
      if(del) del.addEventListener('pointerdown', function(ev){ onDividerPointerDown(ev, d); });
      var hel = world.querySelector('.dividerHandle[data-handle="'+d.id+'"]');
      if(hel) hel.addEventListener('pointerdown', function(ev){ onDividerResizeDown(ev, d); });
    });

    syncNodeHeights(world, nodes);
  }

  // A box used to claim a fixed 15mm of height while only drawing as tall as its text,
  // so its arrow began several millimetres below the visible box. Now the drawn height
  // is measured and written back, and the arrow starts exactly at the box's edge.
  var measuring = false;
  function syncNodeHeights(world, nodes){
    if(measuring) return;
    var changed = false;
    nodes.forEach(function(n){
      if(FE.editingNodeId===n.id) return;
      var el = world.querySelector('.flowNode[data-id="'+n.id+'"]');
      if(!el) return;
      var mm = Math.round(pxToMm(el.offsetHeight)*10)/10;
      if(mm > 0 && Math.abs(mm - nodeH(n)) > 0.3){ n.h = mm; changed = true; }
    });
    if(!changed) return;
    measuring = true;
    try{
      LN.ensureFlowEdgeGaps(FE.note);
      LN.snapOutOfDeadZones(FE.note);
      persistFlow();
      renderCanvas();
    } finally { measuring = false; }
  }

  function autoGrow(n, ta){
    ta.style.height='auto';
    var pxh = Math.max(mmToPx(n.h||LN.MM_PER_NODE_H), ta.scrollHeight);
    ta.style.height = pxh+'px';
    ta.parentElement.style.minHeight = pxh+'px';
  }

  function commitNodeText(id, text){
    var n = nodeById(id);
    if(!n) return;
    n.text = text;
    FE.editingNodeId = null;
    // Stay selected after typing, so the frame toggle is right there for the box you
    // just wrote — tapping the paper anywhere else clears it again.
    FE.selectedNodeId = id;
    FE.selectedAnnoId = null;
    persistFlow();
    renderCanvas();
  }

  function selectNode(id){ FE.selectedNodeId=id; FE.selectedAnnoId=null; renderCanvas(); bringNodeIntoView(id); }
  function enterEditMode(id){ FE.editingNodeId=id; FE.selectedNodeId=id; FE.selectedAnnoId=null; renderCanvas(); bringNodeIntoView(id); }

  // Scrolls the sheet so the box you are working on stays in the part of the screen the
  // keyboard leaves visible — otherwise the box you just tapped sits behind the keyboard
  // and the assist bar while you type into it.
  function bringNodeIntoView(id){
    var n = nodeById(id);
    var vp = document.getElementById('canvasViewport');
    if(!n || !vp) return;
    var vr = vp.getBoundingClientRect();
    var vv = window.visualViewport;
    var assistH = (LN.kbdAssistHeight ? LN.kbdAssistHeight() : 0);
    var visibleBottom = vr.bottom;
    if(vv) visibleBottom = Math.min(visibleBottom, vv.offsetTop + vv.height - assistH);
    var visibleTop = Math.max(vr.top, vv ? vv.offsetTop : 0);
    if(visibleBottom - visibleTop < 60) return; // nothing usable to scroll into
    // Measure the box as drawn: while it is being typed into it is taller than its
    // stored height, and that difference is exactly what would leave it half-hidden.
    var el = document.querySelector('.flowNode[data-id="'+id+'"]');
    var topPx, botPx;
    if(el){
      var er = el.getBoundingClientRect();
      topPx = er.top; botPx = er.bottom;
    } else {
      topPx = vr.top + FE.panY + mmToPx(n.y)*FE.zoom;
      botPx = topPx + mmToPx(nodeH(n))*FE.zoom;
    }
    var pad = 16;
    var dy = 0;
    if(botPx > visibleBottom - pad) dy = (visibleBottom - pad) - botPx;
    else if(topPx < visibleTop + pad) dy = (visibleTop + pad) - topPx;
    if(!dy) return;
    FE.panY += dy;
    clampPan();
    applyWorldTransform();
  }

  // Dragging the ✥ handle moves the box straight away — no hold-still-then-drag.
  function onMoveHandleDown(ev, node){
    ev.preventDefault(); ev.stopPropagation();
    var sx=ev.clientX, sy=ev.clientY, ox=node.x, oy=node.y;
    function mv(e2){
      if(gestureActive){ node.x=ox; node.y=oy; renderCanvas(); up(); return; }
      node.x = LN.clamp(ox + pxToMm((e2.clientX-sx)/FE.zoom), 0, Math.max(0, fullWidthMm()-nodeW(node)));
      node.y = Math.max(0, oy + pxToMm((e2.clientY-sy)/FE.zoom));
      renderCanvas();
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      persistFlow();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up, {once:true});
  }

  function onAnnoMoveHandleDown(ev, anno){
    ev.preventDefault(); ev.stopPropagation();
    var sx=ev.clientX, sy=ev.clientY, ox=anno.x, oy=anno.y;
    function mv(e2){
      if(gestureActive){ anno.x=ox; anno.y=oy; renderCanvas(); up(); return; }
      anno.x = LN.clamp(ox + pxToMm((e2.clientX-sx)/FE.zoom), 0, Math.max(0, fullWidthMm()-14));
      anno.y = Math.max(0, oy + pxToMm((e2.clientY-sy)/FE.zoom));
      renderCanvas();
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      persistFlow();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up, {once:true});
  }

  async function deleteAnnotation(nodeId, annoId){
    var n = nodeById(nodeId);
    if(!n) return;
    var ok = await LN.confirm('この補足を削除しますか?');
    if(!ok) return;
    n.annotations = (n.annotations||[]).filter(function(a){ return a.id!==annoId; });
    if(FE.selectedAnnoId===annoId) FE.selectedAnnoId=null;
    persistFlow(); renderCanvas();
  }

  async function deleteNode(id){
    var n = nodeById(id);
    if(!n) return;
    var ok = await LN.confirm(n.isTitleNode ? 'この見出し(フローの名前と連動しています)を削除しますか?' : 'この工程を削除しますか?(つながる矢印も削除されます)');
    if(!ok) return;
    // Remember which boxes fed this one before the edges go, so the row it shared can
    // close back up afterwards.
    var parents = edgesArr().filter(function(e){ return e.vertical && e.to===id; }).map(function(e){ return e.from; });
    // ...but only when that row is a set of end points. As soon as any box in the row
    // leads on to further steps (three ways to do something, one of which has extra
    // steps in the middle), the remaining boxes keep their size and position so those
    // steps stay under the column they belong to.
    var rowMates = [];
    parents.forEach(function(p){ rowMates = rowMates.concat(downChildrenOf(p)); });
    var keepRowAsIs = rowMates.some(function(k){ return hasNextSteps(k.id); });
    FE.note.nodes = nodesArr().filter(function(x){ return x.id!==id; });
    FE.note.edges = edgesArr().filter(function(e){ return e.from!==id && e.to!==id; });
    if(FE.note.titleNodeId===id) FE.note.titleNodeId=null;
    if(FE.selectedNodeId===id) FE.selectedNodeId=null;
    if(!keepRowAsIs) parents.forEach(relayoutRow);
    persistFlow(); renderCanvas();
  }

  function viewportToWorldMm(clientX, clientY){
    var vp = document.getElementById('canvasViewport').getBoundingClientRect();
    var localX = clientX - vp.left - FE.panX;
    var localY = clientY - vp.top - FE.panY;
    return {x: pxToMm(localX/FE.zoom), y: pxToMm(localY/FE.zoom)};
  }

  function findNodeAt(xmm, ymm, excludeId){
    return nodesArr().find(function(n){
      if(n.id===excludeId) return false;
      var w=nodeW(n), h=nodeH(n);
      return xmm>=n.x-3 && xmm<=n.x+w+3 && ymm>=n.y-3 && ymm<=n.y+h+3;
    });
  }

  function addEdge(fromId, toId, opts){
    if(fromId===toId) return;
    var exists = edgesArr().some(function(e){return e.from===fromId && e.to===toId;});
    if(exists) return;
    var e = {id:LN.uid(), from:fromId, to:toId, label:''};
    // A straight-down swipe records where the drag actually started, so the rendered
    // arrow runs from that point rather than a computed box-center-to-center line.
    if(opts && opts.vertical){ e.vertical=true; e.anchorX=opts.anchorX; }
    edgesArr().push(e);
  }

  function onNodePointerDown(ev, node){
    if(FE.editingNodeId) return;
    ev.preventDefault(); ev.stopPropagation();
    var startX=ev.clientX, startY=ev.clientY, startT=Date.now();
    var origX=node.x, origY=node.y;
    var mode=null;
    var ghost=null;
    // No long-press-to-delete any more: holding still is hard to judge on a phone and it
    // deleted work by accident. Deleting is an explicit ✕ on the selected box instead.

    function move(e2){
      // 2本目の指が乗ったら、ここで始まっていた移動やスワイプは取り消す
      if(gestureActive){
        if(mode==='drag'){ node.x=origX; node.y=origY; renderCanvas(); }
        cleanup();
        return;
      }
      var dx=e2.clientX-startX, dy=e2.clientY-startY;
      var dist=Math.hypot(dx,dy);
      if(!mode){
        if(dist>MOVE_TH){
          mode = (Date.now()-startT)<HOLD_MS ? 'swipe' : 'drag';
          if(mode==='swipe'){
            ghost = document.createElement('div');
            ghost.className='flowGhost';
            var r=rectOf(node);
            ghost.style.left=r.x+'px'; ghost.style.top=r.y+'px'; ghost.style.width=r.w+'px'; ghost.style.height=r.h+'px';
            document.getElementById('canvasWorld').appendChild(ghost);
          } else { selectNode(node.id); }
        } else { return; }
      }
      if(mode==='swipe' && ghost){
        var r=rectOf(node);
        ghost.style.left=(r.x+dx/FE.zoom)+'px'; ghost.style.top=(r.y+dy/FE.zoom)+'px';
      } else if(mode==='drag'){
        // A box can't be dragged off the paper: the printable area is the whole canvas.
        node.x = LN.clamp(origX + pxToMm(dx/FE.zoom), 0, Math.max(0, fullWidthMm()-nodeW(node)));
        node.y = Math.max(0, origY + pxToMm(dy/FE.zoom));
        renderCanvas();
      }
    }
    function up(e2){
      cleanup();
      if(gestureActive) return;   // つまんでいた指を離しただけ
      if(mode==='swipe'){
        var wp = viewportToWorldMm(e2.clientX, e2.clientY);
        var target = findNodeAt(wp.x, wp.y, node.id);
        var dx=e2.clientX-startX, dy=e2.clientY-startY;
        var isDown = Math.abs(dy)>=Math.abs(dx) && dy>0;
        // Record the actual drag-start point (in world mm) so a straight-down arrow can
        // be drawn from where the user began the gesture, not a computed box-center line.
        var startWp = isDown ? viewportToWorldMm(startX, startY) : null;
        var edgeOpts = isDown ? {vertical:true, anchorX:startWp.x} : null;
        // Flicking down again from the same box usually lands on the step the previous
        // flick created. That is not a request to connect two already-connected boxes —
        // it means "another step here", so it makes a sibling beside it instead.
        var alreadyChild = target && isDown && edgesArr().some(function(e){ return e.vertical && e.from===node.id && e.to===target.id; });
        if(target && !alreadyChild){ addEdge(node.id, target.id, edgeOpts); }
        else {
          var w=nodeW(node), h=nodeH(node);
          // Branch boxes (sideways/up) are always the normal compact size, regardless of
          // the source box's own width — only a downward swipe inherits full width.
          var nx,ny,nw=LN.MM_PER_NODE_W, isFull=false;
          if(isDown){
            // Downward swipe continues the main flow. The first one spans the full width;
            // flicking down again from the same box puts the new step beside the first
            // instead of on top of it, and the row is split evenly between them.
            isFull = true;
            var sibs = downChildrenOf(node.id).filter(function(k){ return k.full; });
            nx = 0;
            ny = sibs.length ? Math.min.apply(null, sibs.map(function(k){ return k.y; }))
                             : LN.placeInBand(node.y+h+GAP_MM, h);
          } else if(Math.abs(dx)>Math.abs(dy)){
            if(dx>0){
              nx=node.x+w+GAP_MM; ny=node.y;
              // The page is never wider than its printable content area — narrow the
              // branch box instead of letting it overflow past the right edge. If even a
              // usably small box wouldn't fit (e.g. branching right off an already
              // full-width box), there's genuinely no room, so don't create a broken
              // sliver — tell the user instead.
              var rightBound = fullWidthMm(), minW=12;
              nw = rightBound-nx;
              if(nw<minW){ LN.showToast('右側にスペースがありません。下や左にスワイプしてください','error'); return; }
              nw = Math.min(nw, LN.MM_PER_NODE_W);
            } else { nx=node.x-w-GAP_MM; ny=node.y; }
          } else {
            nx=node.x; ny=node.y-h-GAP_MM;
          }
          var nn = {id:LN.uid(), x:Math.max(0,nx), y:Math.max(0,ny), h:h, text:''};
          if(isFull) nn.full = true; else nn.w = nw;
          nodesArr().push(nn);
          addEdge(node.id, nn.id, edgeOpts);
          if(isDown) relayoutRow(node.id);
          FE.editingNodeId = nn.id;
        }
        persistFlow();
        renderCanvas();
      } else if(mode==='drag'){
        persistFlow();
      } else {
        if(node.isTitleNode){
          var now = Date.now();
          var isDoubleTap = FE.lastTap && FE.lastTap.id===node.id && (now-FE.lastTap.t)<380;
          if(isDoubleTap){
            FE.lastTap = null;
            cycleTitleFrameStyle(node.id);
          } else {
            FE.lastTap = {id:node.id, t:now};
            // Select it too, so the heading also offers its move/delete controls.
            FE.selectedNodeId = node.id;
            renderCanvas();
            var ti = document.getElementById('flowTitle');
            if(ti){ ti.focus(); ti.select(); }
            LN.showToast('見出しはフローの名前欄と連動しています。名前欄で編集してください');
          }
        } else {
          enterEditMode(node.id);
        }
      }
    }
    function cleanup(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if(ghost && ghost.parentElement) ghost.parentElement.removeChild(ghost);
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up, {once:true});
  }

  // 矢印を左右に動かす。動かさずに離したらラベルの編集(今までどおり)。
  // 動かせる範囲は上下の箱が重なっている幅の中だけ — それを外れると矢印が箱から離れてしまうため。
  function onEdgeAnchorDown(ev, e){
    ev.preventDefault(); ev.stopPropagation();
    var a = nodeById(e.from), b = nodeById(e.to);
    if(!a || !b) return;
    var startX = ev.clientX;
    var orig = (typeof e.anchorX === 'number') ? e.anchorX : (a.x + nodeW(a)/2);
    var moved = false;
    var grip = document.querySelector('[data-edgehandle="'+e.id+'"]');
    if(grip) grip.classList.add('dragging');
    function range(){
      var aw = nodeW(a), bw = nodeW(b);
      var lo = Math.max(a.x, b.x) + 2, hi = Math.min(a.x+aw, b.x+bw) - 2;
      if(lo > hi){ var mid = (Math.max(a.x,b.x) + Math.min(a.x+aw, b.x+bw))/2; lo = hi = mid; }
      return [lo, hi];
    }
    function mv(e2){
      if(gestureActive){ e.anchorX = orig; cleanup(); renderCanvas(); return; }
      var dx = e2.clientX - startX;
      if(!moved && Math.abs(dx) > 6) moved = true;
      if(!moved) return;
      var r = range();
      e.anchorX = LN.clamp(orig + pxToMm(dx/FE.zoom), r[0], r[1]);
      renderCanvas();
      var g = document.querySelector('[data-edgehandle="'+e.id+'"]');
      if(g) g.classList.add('dragging');
    }
    function up(){
      cleanup();
      if(gestureActive) return;
      if(moved){ persistFlow(); renderCanvas(); }
      else { editEdge(e.id); }
    }
    function cleanup(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      var g = document.querySelector('[data-edgehandle="'+e.id+'"]');
      if(g) g.classList.remove('dragging');
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up, {once:true});
  }

  function wireViewportPan(){
    var vp = document.getElementById('canvasViewport');
    var panning=false, sx=0, sy=0, ox=0, oy=0;
    // 紙の上の指の動きはすべてアプリが受け取る。これが無いと、下フリックが
    // ブラウザの「引っ張って更新」に取られてしまう。
    vp.addEventListener('touchmove', function(ev){
      if(ev.target && ev.target.closest && ev.target.closest('textarea,input')) return; // 文字の選択は邪魔しない
      if(ev.cancelable) ev.preventDefault();
    }, {passive:false});
    // ---- 2本指の操作(つまんで拡大・縮小、2本指で紙を動かす) ----
    // 指の出入りは capture で先に拾う。箱の上から始めた指でも、2本目が乗った時点で
    // 「紙をつまむ」操作に切り替わるようにするため。
    var pts = {};          // pointerId -> {x,y}
    var gz = null;         // つまみ始めたときの指の間隔・中点・そのときの拡大率と位置
    function ptCount(){ return Object.keys(pts).length; }

    function startPinch(){
      var ids = Object.keys(pts), a = pts[ids[0]], b = pts[ids[1]];
      gz = {
        d: Math.max(1, Math.hypot(a.x-b.x, a.y-b.y)),
        mx: (a.x+b.x)/2, my: (a.y+b.y)/2,
        zoom: FE.zoom, panX: FE.panX, panY: FE.panY
      };
      gestureActive = true;
      panning = false;      // 1本指のパンとは同時に動かさない
    }
    function updatePinch(){
      if(!gz || ptCount() < 2) return;
      var ids = Object.keys(pts), a = pts[ids[0]], b = pts[ids[1]];
      var d = Math.max(1, Math.hypot(a.x-b.x, a.y-b.y));
      var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      var z = LN.clamp(gz.zoom * (d/gz.d), 0.5, 2.2);
      var k = z / gz.zoom;
      FE.zoom = z;
      updateCanvasViewportWidth();     // 紙の幅が変わるので、先に編集エリアを合わせる
      var vr = vp.getBoundingClientRect();
      // つまみ始めた点の下にある紙の位置を動かさずに拡大し、そのうえで中点の移動分だけ紙を送る
      var ax = gz.mx - vr.left, ay = gz.my - vr.top;
      FE.panX = (gz.panX - ax)*k + ax + (mx - gz.mx);
      FE.panY = (gz.panY - ay)*k + ay + (my - gz.my);
      clampPan();
      applyWorldTransform();
    }
    function endPinch(){
      gz = null;
      // 指が全部離れるまでは箱の操作を戻さない。先に離れた1本で
      // 箱を動かしたり次の工程を作ったりしてしまわないようにするため。
      if(ptCount() === 0) setTimeout(function(){ gestureActive = false; }, 60);
    }

    vp.addEventListener('pointerdown', function(ev){
      if(ev.pointerType === 'mouse' && ev.buttons === 0) return;
      // 新しく画面に触れた最初の1本(isPrimary)なら、そこが一連の操作の始まり。
      // 前回の指を離したことを取りこぼしていても、ここで必ず元に戻るので、
      // 「つまんだあと箱が操作できなくなる」状態に居残らない。
      if(!gz && ev.isPrimary){ pts = {}; gestureActive = false; panning = false; }
      pts[ev.pointerId] = {x:ev.clientX, y:ev.clientY};
      if(ptCount() === 2) startPinch();
    }, true);
    function onDocMove(ev){
      if(!pts[ev.pointerId]) return;
      pts[ev.pointerId] = {x:ev.clientX, y:ev.clientY};
      if(gz) updatePinch();
    }
    function onDocUp(ev){
      if(!pts[ev.pointerId]) return;
      delete pts[ev.pointerId];
      if(ptCount() < 2) endPinch();
    }
    document.addEventListener('pointermove', onDocMove, true);
    document.addEventListener('pointerup', onDocUp, true);
    document.addEventListener('pointercancel', onDocUp, true);
    // 編集画面を閉じたら、この画面ぶんの見張りも外す
    FE.releaseGestureHooks = function(){
      document.removeEventListener('pointermove', onDocMove, true);
      document.removeEventListener('pointerup', onDocUp, true);
      document.removeEventListener('pointercancel', onDocUp, true);
      pts = {}; gz = null; gestureActive = false;
    };

    vp.addEventListener('pointerdown', function(ev){
      if(gestureActive) return;
      if(ev.target.closest('.flowNode') || ev.target.closest('.flowArrowLabel') || ev.target.closest('.flowAnnotation') || ev.target.closest('.flowDivider') || ev.target.closest('.dividerHandle') || ev.target.closest('.nodeBtn')) return;
      // Touching bare paper deselects, which also puts the controls away.
      if(FE.selectedNodeId || FE.selectedAnnoId){ FE.selectedNodeId=null; FE.selectedAnnoId=null; renderCanvas(); }
      panning=true; sx=ev.clientX; sy=ev.clientY; ox=FE.panX; oy=FE.panY;
    });
    vp.addEventListener('pointermove', function(ev){
      if(!panning || gestureActive) return;
      FE.panX = ox + (ev.clientX-sx);
      FE.panY = oy + (ev.clientY-sy);
      // The sheet can't be dragged sideways out of view: the paper's width is the
      // editing width, so horizontal panning only exists while zoomed past it.
      clampPan();
      applyWorldTransform();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(evt){
      vp.addEventListener(evt, function(){ panning=false; });
    });
  }

  function addFreeNode(fullWidth){
    // fullWidth=true is only used for the very first box of a brand-new flow (the
    // opening step of the main trunk). The manual "+" button instead adds a small,
    // arrow-less label box (e.g. a 【茶葉】-style tag) at a normal compact size.
    // Default the new box's position to just below the current lowest content
    // (a node or a divider), not a fixed point near the viewport's top-left —
    // anchoring to the viewport meant every box added via "+" without first
    // scrolling/panning landed at the exact same spot and piled up directly on
    // top of the heading and each other.
    var nodes = nodesArr(), dividers = dividersArr();
    var maxY = null;
    nodes.forEach(function(n){ var b = n.y + nodeH(n); if(maxY===null||b>maxY) maxY=b; });
    dividers.forEach(function(d){ if(maxY===null||d.y>maxY) maxY=d.y; });
    var y = LN.placeInBand(maxY!==null ? maxY + GAP_MM : 0, LN.MM_PER_NODE_H);
    var nn = {id:LN.uid(), x:0, y:Math.max(0,y), h:LN.MM_PER_NODE_H, text:''};
    if(fullWidth) nn.full = true; else nn.w = LN.MM_PER_NODE_W;
    nodesArr().push(nn);
    FE.editingNodeId = nn.id;
    persistFlow();
    renderCanvas();
  }

  async function editEdge(id){
    var e = edgesArr().find(function(x){return x.id===id;});
    if(!e) return;
    var val = await LN.promptOrDelete('矢印のラベル(空でラベルなし)', e.label||'', '矢印を削除');
    if(val===null) return;
    if(val==='__delete__'){
      var ok = await LN.confirm('この矢印を削除しますか?');
      if(ok){
        FE.note.edges = edgesArr().filter(function(x){return x.id!==id;});
        persistFlow(); renderCanvas();
      }
      return;
    }
    e.label = val.trim();
    ensureGapForEdgeLabel(e);
    persistFlow(); renderCanvas();
  }

  function toggleNodeStyle(nodeId){
    var n = nodeById(nodeId);
    if(!n) return;
    if(n.isTitleNode){ LN.showToast('見出しはフローの名前と連動しているためスタイルは固定です'); return; }
    n.style = n.style==='heading' ? 'normal' : 'heading';
    persistFlow();
    renderCanvas();
  }

  // The title heading's own frame design (thickness / double line / underline), separate
  // from the heading-vs-normal H toggle other boxes use. Cycled via double-tap on the
  // title box itself.
  var TITLE_FRAME_STYLES = ['solid','double','thin','underline'];
  function cycleTitleFrameStyle(nodeId){
    var n = nodeById(nodeId);
    if(!n) return;
    var idx = TITLE_FRAME_STYLES.indexOf(n.frameStyle||'solid');
    n.frameStyle = TITLE_FRAME_STYLES[(idx+1)%TITLE_FRAME_STYLES.length];
    persistFlow();
    renderCanvas();
    var label = {solid:'ふつう', double:'二重線', thin:'細線', underline:'下線のみ'}[n.frameStyle];
    LN.showToast('見出しの枠: '+label);
  }

  function addAnnotation(nodeId){
    var n = nodeById(nodeId);
    if(!n) return;
    var w = nodeW(n), fw = fullWidthMm();
    if(!n.annotations) n.annotations=[];
    // Beside the box when the page still has room there; otherwise directly underneath
    // it, with the rest of the flow pushed down to make space. (Parking it to the right
    // of a full-width box is what used to shove notes off the paper entirely.)
    var anno;
    if(n.x + w + 6 + 26 <= fw){
      anno = {id:LN.uid(), x:n.x+w+6, y:n.y, text:'', groups:[]};
    } else {
      var below = n.y + nodeH(n) + 2;
      LN.shiftContentBelow(FE.note, below, 16);
      anno = {id:LN.uid(), x:Math.min(3, Math.max(0,fw-30)), y:below, text:'', groups:[]};
    }
    n.annotations.push(anno);
    persistFlow();
    renderCanvas();
    openAnnotationEditor(nodeId, anno.id);
  }

  // (insertAtCursor/wrapSelection now live in LN, shared with the global keyboard-assist bar)
  var insertAtCursor = LN.insertAtCursor, wrapSelection = LN.wrapSelection;
  function computeLineGroup(ta){
    var v = ta.value, s=ta.selectionStart, e=ta.selectionEnd;
    if(s===e) return null;
    var startLine = v.slice(0,s).split('\n').length-1;
    var endLine = startLine + v.slice(s,e).split('\n').length-1;
    return {start:startLine, end:endLine};
  }

  function openAnnotationEditor(nodeId, annoId){
    var n = nodeById(nodeId);
    if(!n) return;
    var anno = (n.annotations||[]).find(function(a){return a.id===annoId;});
    if(!anno) return;
    var groupsLocal = (anno.groups||[]).slice();
    var ov = document.createElement('div'); ov.className='modalOverlay';
    ov.innerHTML =
      '<div class="annoEditBox">' +
        '<div class="modalMsg" style="margin-bottom:8px; font-weight:700;">工程への補足</div>' +
        '<div class="annoToolbar">' +
          '<button type="button" class="btn small" data-ins="key">【 】</button>' +
          '<button type="button" class="btn small" data-ins="bullet">・</button>' +
          '<button type="button" class="btn small" data-ins="c1">①</button>' +
          '<button type="button" class="btn small" data-ins="c2">②</button>' +
          '<button type="button" class="btn small" data-ins="c3">③</button>' +
          '<button type="button" class="btn small" data-ins="note">※</button>' +
          '<button type="button" class="btn small" data-ins="group">くくる</button>' +
        '</div>' +
        '<textarea class="assistTa" id="annoTa" placeholder="補足を入力(【】でキー囲み、・で箇条書き、複数行選んで「くくる」)">'+esc(anno.text||'')+'</textarea>' +
        '<div class="modalBtns" style="justify-content:space-between;">' +
          '<button type="button" class="btn danger" data-a="del">削除</button>' +
          '<div style="display:flex; gap:8px;"><button type="button" class="btn" data-a="cancel">キャンセル</button><button type="button" class="btn primary" data-a="ok">保存</button></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    var ta = ov.querySelector('#annoTa');
    ta.focus();
    ov.querySelectorAll('[data-ins]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var kind = btn.dataset.ins;
        if(kind==='key') wrapSelection(ta,'【','】');
        else if(kind==='bullet') insertAtCursor(ta,'・');
        else if(kind==='c1') insertAtCursor(ta,'①');
        else if(kind==='c2') insertAtCursor(ta,'②');
        else if(kind==='c3') insertAtCursor(ta,'③');
        else if(kind==='note') insertAtCursor(ta,'※');
        else if(kind==='group'){
          var g = computeLineGroup(ta);
          if(!g){ LN.showToast('まとめたい行を選択してください','error'); return; }
          groupsLocal = groupsLocal.filter(function(x){ return !(x.start<=g.end && x.end>=g.start); });
          groupsLocal.push(g);
          LN.showToast('選択した行をくくりました');
        }
      });
    });
    // Closing the editor leaves the note selected, so its ✥/✕ are right there.
    function close(){ if(ov.parentNode) document.body.removeChild(ov); renderCanvas(); }
    ov.addEventListener('click', async function(e){
      if(e.target===ov){ close(); return; }
      var b = e.target.closest('button[data-a]'); if(!b) return;
      var act = b.dataset.a;
      if(act==='cancel'){ close(); return; }
      if(act==='del'){
        var ok = await LN.confirm('この補足を削除しますか?');
        if(ok){
          n.annotations = (n.annotations||[]).filter(function(a){return a.id!==annoId;});
          persistFlow(); renderCanvas(); close();
        }
        return;
      }
      if(act==='ok'){
        anno.text = ta.value;
        anno.groups = groupsLocal;
        persistFlow(); renderCanvas(); close();
      }
    });
  }

  function onAnnotationPointerDown(ev, node, anno){
    ev.preventDefault(); ev.stopPropagation();
    var startX=ev.clientX, startY=ev.clientY;
    var origX=anno.x, origY=anno.y;
    var moved=false;
    // Like the boxes: no long press. A tap opens the note for editing and leaves it
    // selected, and its own ✥ / ✕ handle the moving and deleting.
    function move(e2){
      if(gestureActive){
        if(moved){ anno.x=origX; anno.y=origY; renderCanvas(); }
        cleanup();
        return;
      }
      var dx=e2.clientX-startX, dy=e2.clientY-startY;
      if(!moved && Math.hypot(dx,dy)>MOVE_TH){ moved=true; }
      if(moved){
        anno.x = LN.clamp(origX + pxToMm(dx/FE.zoom), 0, Math.max(0, fullWidthMm()-14));
        anno.y = Math.max(0, origY + pxToMm(dy/FE.zoom));
        renderCanvas();
      }
    }
    function up(){
      cleanup();
      if(gestureActive) return;
      if(moved){ persistFlow(); return; }
      FE.selectedAnnoId = anno.id;
      FE.selectedNodeId = null;
      openAnnotationEditor(node.id, anno.id);
    }
    function cleanup(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up, {once:true});
  }

  function addDivider(){
    // Default the divider to the full printable width, left-aligned at x=2 — like the
    // main-trunk boxes and the heading — instead of a small fixed 80mm line dropped at
    // the viewport's center, which is why it always looked "stranded in the middle"
    // regardless of the surrounding content. Also default its y to just below the
    // current lowest content (a node or another divider) so a newly added divider
    // continues the flow downward instead of landing on top of existing boxes.
    var nodes = nodesArr(), dividers = dividersArr();
    var maxY = null;
    nodes.forEach(function(n){ var b = n.y + nodeH(n); if(maxY===null||b>maxY) maxY=b; });
    dividers.forEach(function(d2){ if(maxY===null||d2.y>maxY) maxY=d2.y; });
    var y = LN.placeInBand(maxY!==null ? maxY + GAP_MM : 0, 2);
    var d = {id:LN.uid(), x:0, y:Math.max(0,y), full:true};
    dividersArr().push(d);
    persistFlow();
    renderCanvas();
  }

  function onDividerPointerDown(ev, div){
    ev.preventDefault(); ev.stopPropagation();
    var startX=ev.clientX, startY=ev.clientY;
    var origX=div.x, origY=div.y;
    var moved=false;
    var longTimer = setTimeout(async function(){
      if(!moved){
        cleanup();
        var ok = await LN.confirm('この区切り線を削除しますか?');
        if(ok){
          FE.note.dividers = dividersArr().filter(function(x){return x.id!==div.id;});
          persistFlow(); renderCanvas();
        }
      }
    }, 650);
    function move(e2){
      if(gestureActive){ clearTimeout(longTimer); if(moved){ div.x=origX; div.y=origY; renderCanvas(); } cleanup(); return; }
      var dx=e2.clientX-startX, dy=e2.clientY-startY;
      if(!moved && Math.hypot(dx,dy)>MOVE_TH){ moved=true; clearTimeout(longTimer); }
      if(moved){
        div.x = origX + pxToMm(dx/FE.zoom);
        div.y = origY + pxToMm(dy/FE.zoom);
        renderCanvas();
      }
    }
    function up(){
      cleanup();
      clearTimeout(longTimer);
      if(moved) persistFlow();
    }
    function cleanup(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up, {once:true});
  }

  function onDividerResizeDown(ev, div){
    ev.preventDefault(); ev.stopPropagation();
    var startX=ev.clientX;
    var origW=dividerW(div);
    function move(e2){
      if(gestureActive){ up(); return; }
      var dx=e2.clientX-startX;
      // Resizing by hand turns a full-width rule into one with its own width, and it
      // still can't run past the printable edge.
      div.full = false;
      div.w = LN.clamp(origW + pxToMm(dx/FE.zoom), 10, fullWidthMm()-div.x);
      renderCanvas();
    }
    function up(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      persistFlow();
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up, {once:true});
  }

  window.App = window.App || {};
  Object.assign(window.App, {
    openFlowEditor: openFlowEditor,
    closeEditor: function(){ if(FE && FE.releaseGestureHooks) FE.releaseGestureHooks(); FE=null; App.goTab('list'); },
    toggleHint: toggleHint,
    deleteNode: deleteNode,
    deleteAnnotation: deleteAnnotation,
    flowZoom: function(dir){
      var before = FE.zoom;
      FE.zoom = LN.clamp(FE.zoom + dir*0.2, 0.5, 2.2);
      // Keep the same point of the sheet under the view while zooming.
      FE.panY = FE.panY * (FE.zoom/before);
      updateCanvasViewportWidth(); clampPan(); applyWorldTransform();
    },
    addFreeNode: function(){ addFreeNode(false); },
    addDivider: addDivider,
    addAnnotation: addAnnotation,
    toggleNodeStyle: toggleNodeStyle,
    editEdge: editEdge
  });
})();
</script>
<script>
(function(){
  "use strict";
  var LN = window.LN, state = LN.state, ICONS = LN.ICONS, esc = LN.esc;
  var ME = null; // {note}

  function persistMemo(){
    LN.patchNote(ME.note.id, {title: ME.note.title, categoryId: ME.note.categoryId, content: ME.note.content});
  }

  function openMemoEditor(id){
    var n = state.notes.find(function(x){return x.id===id;});
    if(!n){ App.goTab('list'); return; }
    ME = {note: JSON.parse(JSON.stringify(n))};
    document.getElementById('topbar').innerHTML =
      '<button class="backbtn" onclick="App.closeMemoEditor()">'+ICONS.back+'</button>' +
      '<input class="titlein" id="memoTitle" placeholder="メモの名前" value="'+esc(ME.note.title||'')+'">' +
      '<button class="tbaction" onclick="App.confirmDeleteNote(\''+ME.note.id+'\', true)">削除</button>';
    document.getElementById('memoTitle').addEventListener('change', function(){ ME.note.title=this.value; persistMemo(); });

    var catOpts = '<option value="">未分類</option>' + state.categories.slice().sort(LN.byOrder).map(function(c){
      return '<option value="'+c.id+'"'+(c.id===(ME.note.categoryId||'')?' selected':'')+'>'+esc(c.name)+'</option>';
    }).join('');

    var view = document.getElementById('view');
    view.className='flush';
    view.innerHTML =
      '<div style="display:flex; flex-direction:column; height:100%;">' +
      '<div class="memoToolbar">' +
        '<select id="memoCat" style="border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface-2);color:var(--ink);font-size:12px;">'+catOpts+'</select>' +
        '<button class="btn small" onclick="App.insertKeyBox()">【 】キー囲み</button>' +
        '<button class="btn small" onclick="App.convertBullets()">・箇条書きに変換</button>' +
      '</div>' +
      '<div class="memoSplit">' +
        '<textarea class="assistTa" id="memoContent" placeholder="ここにメモを入力。【小計】のようにカッコで囲むとキー表示になります。">'+esc(ME.note.content||'')+'</textarea>' +
        '<div class="memoPreview" id="memoPreview"></div>' +
      '</div></div>';
    document.getElementById('memoCat').addEventListener('change', function(){ ME.note.categoryId=this.value; persistMemo(); });
    var ta = document.getElementById('memoContent');
    ta.addEventListener('input', function(){ ME.note.content=this.value; renderMemoPreview(); });
    ta.addEventListener('blur', function(){ persistMemo(); });
    renderMemoPreview();
  }

  function renderMemoPreview(){
    var el = document.getElementById('memoPreview');
    if(!el) return;
    var content = ME.note.content||'';
    el.innerHTML = content.trim() ? LN.renderRichText(content) : '<div class="ph">プレビュー(【 】で囲むとキー表示、・で箇条書きになります)</div>';
  }

  function insertKeyBox(){
    var ta = document.getElementById('memoContent');
    var s=ta.selectionStart, e=ta.selectionEnd;
    var text=ta.value;
    var sel = text.slice(s,e);
    ta.value = text.slice(0,s) + '【' + sel + '】' + text.slice(e);
    var cursor = sel ? s+sel.length+2 : s+1;
    ta.focus(); ta.setSelectionRange(cursor,cursor);
    ME.note.content = ta.value;
    renderMemoPreview();
  }

  function convertBullets(){
    var ta = document.getElementById('memoContent');
    var text = ta.value;
    var start = ta.selectionStart, end = ta.selectionEnd;
    var pStart, pEnd;
    if(start===end){
      pStart = text.lastIndexOf('\n\n', Math.max(0,start-1)); pStart = pStart<0 ? 0 : pStart+2;
      pEnd = text.indexOf('\n\n', start); pEnd = pEnd<0 ? text.length : pEnd;
    } else { pStart=start; pEnd=end; }
    var para = text.slice(pStart,pEnd);
    if(!para.trim()){ LN.showToast('箇条書きにする文章を選択するか、段落内にカーソルを置いてください','error'); return; }
    var lines = para.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    var items = lines.length>1 ? lines : para.split('。').map(function(s){return s.trim();}).filter(Boolean);
    var bulletText = items.map(function(s){ return '・'+s.replace(/^・/,'').replace(/。$/,''); }).join('\n');
    ta.value = text.slice(0,pStart) + bulletText + text.slice(pEnd);
    ME.note.content = ta.value;
    persistMemo();
    renderMemoPreview();
  }

  window.App = window.App || {};
  Object.assign(window.App, {
    openMemoEditor: openMemoEditor,
    closeMemoEditor: function(){ ME=null; App.goTab('list'); },
    insertKeyBox: insertKeyBox,
    convertBullets: convertBullets
  });
})();
</script>
<script>
(function(){
  "use strict";
  var LN = window.LN, state = LN.state, ICONS = LN.ICONS, esc = LN.esc;
  var PX_PER_MM = 3.7795;

  function nodeById2(note,id){ return (note.nodes||[]).find(function(n){return n.id===id;}); }
  function rectEdgePointMm(r, tx,ty){
    var cx=r.x+r.w/2, cy=r.y+r.h/2, dx=tx-cx, dy=ty-cy;
    if(dx===0&&dy===0) return {x:cx,y:cy};
    var hw=r.w/2, hh=r.h/2;
    var sx = dx!==0 ? hw/Math.abs(dx) : Infinity;
    var sy = dy!==0 ? hh/Math.abs(dy) : Infinity;
    var s=Math.min(sx,sy);
    return {x:cx+dx*s, y:cy+dy*s};
  }

  function printableNotes(){
    var list = state.notes.slice().sort(LN.byOrder);
    if(state.printCat!=='all') list = list.filter(function(n){ return (n.categoryId||'')===state.printCat; });
    return list;
  }

  // Sheets are cut from a grid anchored at the note's own origin (0,0 = top-left of the
  // printable area), NOT at the content's bounding box. Anchoring to the bounding box
  // used to shift everything by the padding it added, which is what pushed full-width
  // boxes past the right margin and cut their frames off.
  function computeFlowTiles(note, tileWmm, tileHmm){
    var nodes = note.nodes||[];
    var dividers = note.dividers||[];
    if(nodes.length===0 && dividers.length===0) return [{originX:0, originY:0}];
    var maxX=0, maxY=0;
    nodes.forEach(function(n){
      maxX=Math.max(maxX, n.x+LN.nodeWmm(n)); maxY=Math.max(maxY, n.y+LN.nodeHmm(n));
      (n.annotations||[]).forEach(function(a){
        maxX=Math.max(maxX, a.x+20); maxY=Math.max(maxY, a.y+LN.annoHeightMm(a));
      });
    });
    dividers.forEach(function(d){
      maxX=Math.max(maxX, d.x+LN.dividerWmm(d)); maxY=Math.max(maxY, d.y+2);
    });
    var cols = Math.max(1, Math.ceil((maxX-0.2)/tileWmm));
    var rows = Math.max(1, LN.pageIndexOf(maxY-0.2)+1);
    var tiles=[];
    // Row r is sheet r: its writable band starts one paper-height apart from the last,
    // exactly as the editor draws the sheets.
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) tiles.push({originX:c*tileWmm, originY:LN.bandTopMm(r)});
    return tiles;
  }

  function renderFlowTileInner(note, tile, tileWmm, tileHmm, fontPt){
    var nodesHtml = (note.nodes||[]).map(function(n){
      var w=LN.nodeWmm(n), h=LN.nodeHmm(n);
      // Only real ink is printed. A main-flow box (full width) gets no frame and no
      // white fill at all, so the flow reads like a written page on the grid paper;
      // frames belong to the title, an emphasised box and small call-outs.
      var kind = LN.frameKindOf(n), frame;
      if(kind==='plain'){
        frame = 'border:none; background:transparent; padding:0.6mm 0.2mm;';
      } else if(kind==='title'){
        var fs = n.frameStyle||'solid';
        if(fs==='double') frame = 'border:0.25mm solid #1a1a1a; box-shadow:0 0 0 0.3mm #fff, 0 0 0 0.55mm #1a1a1a; font-weight:700;';
        else if(fs==='thin') frame = 'border:0.15mm solid #1a1a1a; font-weight:500;';
        else if(fs==='underline') frame = 'border:none; border-bottom:0.4mm solid #1a1a1a; border-radius:0; background:transparent; padding-left:0.4mm; font-weight:700;';
        else frame = 'border:0.3mm solid #1a1a1a; font-weight:700;';
      } else if(kind==='emph'){
        frame = 'border:0.45mm solid #1a1a1a; font-weight:700;';
      } else {
        frame = 'border:0.25mm solid #1a1a1a;';
      }
      // 見出しは角丸なし。工程の箱と見分けるための差なので、印刷でも同じにする。
      var radius = (kind==='title') ? '0' : '1mm';
      return '<div style="position:absolute; left:'+n.x+'mm; top:'+n.y+'mm; width:'+w+'mm; min-height:'+h+'mm; border-radius:'+radius+'; padding:1mm 1.3mm; font-size:'+fontPt+'pt; line-height:1.28; overflow:hidden; '+frame+'">'+(LN.renderRichText(n.text||''))+'</div>';
    }).join('');
    var annoFontPt = Math.max(6, fontPt-1.5);
    var annoHtml = (note.nodes||[]).map(function(n){
      return (n.annotations||[]).map(function(a){
        var body = LN.renderAnnotationHtml(a.text||'', a.groups) || '';
        // Notes print as plain text (their bracket is the only ink), and may use the rest
        // of the printable width instead of being squeezed into a 34mm column.
        var awMm = Math.max(18, LN.fullWidthMm() - a.x);
        return '<div style="position:absolute; left:'+a.x+'mm; top:'+a.y+'mm; max-width:'+awMm+'mm; padding:0.3mm 0.4mm; font-size:'+annoFontPt+'pt; line-height:1.3;">'+body+'</div>';
      }).join('');
    }).join('');
    var dividerHtml = (note.dividers||[]).map(function(d){
      return '<div style="position:absolute; left:'+d.x+'mm; top:'+d.y+'mm; width:'+LN.dividerWmm(d)+'mm; border-top:0.35mm solid #555;"></div>';
    }).join('');
    var edgesHtml = '<svg style="position:absolute;left:0;top:0;overflow:visible;" width="2mm" height="2mm"><defs>' +
      '<marker id="pah" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#333"/></marker>' +
      '<marker id="pahAnno" markerWidth="5" markerHeight="5" refX="4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#888"/></marker>' +
      '</defs>' +
      (note.edges||[]).map(function(e){
        var a=nodeById2(note,e.from), b=nodeById2(note,e.to);
        if(!a||!b) return '';
        var ra={x:a.x,y:a.y,w:LN.nodeWmm(a),h:LN.nodeHmm(a)}, rb={x:b.x,y:b.y,w:LN.nodeWmm(b),h:LN.nodeHmm(b)};
        var p1,p2;
        if(e.vertical){
          // Matches the on-canvas editor: a down-swipe arrow runs straight down from the
          // point the user actually started dragging, not a computed center-to-center line.
          var lo=Math.max(ra.x,rb.x)+2, hi=Math.min(ra.x+ra.w,rb.x+rb.w)-2;
          var axmm=(typeof e.anchorX==='number')?e.anchorX:(ra.x+ra.w/2);
          if(lo>hi){ lo=hi=axmm; }
          axmm=LN.clamp(axmm,lo,hi);
          var belowsource = rb.y >= ra.y;
          var y1=belowsource?ra.y+ra.h:ra.y, y2=belowsource?rb.y:rb.y+rb.h;
          p1={x:axmm,y:y1}; p2={x:axmm,y:y2};
        } else {
          p1=rectEdgePointMm(ra, rb.x+rb.w/2, rb.y+rb.h/2);
          p2=rectEdgePointMm(rb, ra.x+ra.w/2, ra.y+ra.h/2);
        }
        var lbl = '';
        if(e.label){
          if(e.vertical){
            // Plain text beside the arrow — no bubble, no box, no connector: on paper the
            // words simply sit to the right of the line, and the arrow stays untouched.
            // A long label (or several close-together arrows) wraps onto more lines, and
            // the arrow itself was already lengthened to make room for them.
            var wrapped = LN.wrapEdgeLabel(e.label);
            var lines=wrapped.lines, lineH=wrapped.lineH, boxH=wrapped.boxH;
            var midY=(p1.y+p2.y)/2, textX=p1.x+2.2;
            var firstY=midY-boxH/2+2.6;
            lbl = lines.map(function(l,i){
              return '<text x="'+textX+'mm" y="'+(firstY+i*lineH)+'mm" font-size="6.6" fill="#1a1a1a">'+esc(l)+'</text>';
            }).join('');
          } else {
            lbl = '<text x="'+((p1.x+p2.x)/2)+'mm" y="'+((p1.y+p2.y)/2)+'mm" font-size="7" fill="#333" text-anchor="middle" style="paint-order:stroke; stroke:#fff; stroke-width:1.6mm;">'+esc(e.label)+'</text>';
          }
        }
        return '<line x1="'+p1.x+'mm" y1="'+p1.y+'mm" x2="'+p2.x+'mm" y2="'+p2.y+'mm" stroke="#333" stroke-width="0.35mm" marker-end="url(#pah)"/>'+lbl;
      }).join('') +
      '</svg>';
    // .inner needs a real width: an absolutely positioned child with no width of its own
    // (a note) otherwise shrink-to-fits against a zero-width container and collapses to
    // one character per line — which is why "セイロン" used to print vertically.
    return '<div class="content" style="left:0; top:0; width:'+tileWmm+'mm; height:'+tileHmm+'mm;">' +
      '<div class="inner" style="left:'+(-tile.originX)+'mm; top:'+(-tile.originY)+'mm; width:'+(tileWmm+tile.originX)+'mm;">'+edgesHtml+dividerHtml+nodesHtml+annoHtml+'</div></div>';
  }

  function computeMemoChunks(note, tileWmm, tileHmm, fontPt){
    var lineHmm = fontPt*0.3528*1.5;
    var linesPerPage = Math.max(4, Math.floor((tileHmm-4)/lineHmm));
    var linesAll = (note.content||'').split('\n');
    var chunks=[];
    for(var i=0;i<linesAll.length;i+=linesPerPage){ chunks.push(linesAll.slice(i,i+linesPerPage).join('\n')); }
    if(chunks.length===0) chunks=[''];
    return chunks;
  }

  // returns array of {title, html} sheets (each = one mini page's worth of content, no outer frame)
  function buildSheets(notes, s){
    var tileWmm = s.paperW - s.marginMm*2;
    var tileHmm = s.paperH - s.holeMm - s.marginMm;
    var sheets = [];
    notes.forEach(function(note){
      // A thin category-color tab down the left margin, so pages stay identifiable by
      // category once printed and mixed into a binder — matches the note's own category
      // color (blank/gray when uncategorized, same as its list-view tag).
      var cat = LN.catById(note.categoryId);
      var catHex = cat ? cat.hex : '';
      if(note.type==='flow'){
        // Self-heal: a note saved by an older version may still be on the old geometry,
        // be short of room for a wrapped arrow label, or have a box straddling the end
        // of a sheet. Printing shouldn't show a broken layout, so fix it up first — and
        // save the result, so the one-time geometry migration stays one-time.
        var migrated = LN.normalizeFlowGeometry(note);
        LN.ensureFlowEdgeGaps(note);
        LN.snapOutOfDeadZones(note);
        if(migrated) LN.patchNote(note.id, {nodes:note.nodes, dividers:note.dividers, geomV2:true});
        var tiles = computeFlowTiles(note, tileWmm, tileHmm);
        tiles.forEach(function(tile, i){
          sheets.push({title: note.title + (tiles.length>1 ? ' ('+(i+1)+'/'+tiles.length+')' : ''), html: renderFlowTileInner(note, tile, tileWmm, tileHmm, s.fontPt), catHex: catHex});
        });
      } else {
        var chunks = computeMemoChunks(note, tileWmm, tileHmm, s.fontPt);
        chunks.forEach(function(chunk, i){
          var html = '<div class="memotext" style="font-size:'+s.fontPt+'pt;">'+LN.renderRichText(chunk)+'</div>';
          sheets.push({title: note.title + (chunks.length>1 ? ' ('+(i+1)+'/'+chunks.length+')' : ''), html: html, catHex: catHex});
        });
      }
    });
    return sheets;
  }

  function sheetFrame(sheet, s){
    var holes = '';
    var n = s.holeMm>0 ? 9 : 0; // the mini loose-leaf's own punch count
    for(var i=0;i<n;i++) holes += '<span></span>';
    var catTab = sheet.catHex ? '<div style="position:absolute; left:1mm; top:'+s.holeMm+'mm; width:2mm; bottom:'+(s.marginMm*0.6)+'mm; background:'+sheet.catHex+'; border-radius:1mm;"></div>' : '';
    return '<div class="printSheet mini" style="--pw:'+s.paperW+'; --ph:'+s.paperH+'; --holemm:'+s.holeMm+'mm; --gridpx:'+(s.gridMm*PX_PER_MM)+'px;">' +
      (s.holeMm>0 ? '<div class="holes">'+holes+'</div>' : '') +
      '<div class="grid"></div>' +
      catTab +
      '<div style="position:absolute; left:0; top:'+s.holeMm+'mm; width:100%; height:calc(100% - '+s.holeMm+'mm);">'+
        '<div style="position:absolute; left:'+s.marginMm+'mm; top:0; right:'+s.marginMm+'mm; bottom:'+s.marginMm+'mm; overflow:hidden;">'+sheet.html+'</div>' +
      '</div></div>';
  }

  function buildPrintHtml(previewMode){
    var s = state.settings;
    var notes = printableNotes();
    var sheets = buildSheets(notes, s);
    if(sheets.length===0) return {html:'<div class="empty" style="padding:30px;"><p>対象のメモがありません</p></div>', count:0};
    var html;
    if(s.printMode==='a4'){
      var perPage=4, pages=[];
      for(var i=0;i<sheets.length;i+=perPage) pages.push(sheets.slice(i,i+perPage));
      html = pages.map(function(pg){
        var cells = pg.map(function(sh){ return '<div class="cell">'+sheetFrame(sh,s)+'</div>'; }).join('');
        while(cells.split('class="cell"').length-1 < perPage){ cells += '<div class="cell" style="border-style:dashed; opacity:.3;"></div>'; }
        return '<div class="a4sheet">'+cells+'</div>';
      }).join('');
    } else {
      html = sheets.map(function(sh){ return sheetFrame(sh,s); }).join('');
    }
    return {html:html, count:sheets.length};
  }

  function updatePrintPageStyle(){
    var s = state.settings;
    var pageSize = s.printMode==='a4' ? '210mm 297mm' : (s.paperW+'mm '+s.paperH+'mm');
    document.getElementById('pagestyle').textContent =
      '@page{ size: '+pageSize+'; margin: 0mm; }' +
      '@media print{ .printSheet{ width:'+s.paperW+'mm !important; height:'+s.paperH+'mm !important; zoom:1 !important; } .a4sheet{ zoom:1 !important; width:210mm !important; height:297mm !important; } }';
  }

  function renderPrint(){
    var s = state.settings;
    var catOpts = '<option value="all"'+(state.printCat==='all'?' selected':'')+'>すべてのメモ</option>' +
      '<option value=""'+(state.printCat===''?' selected':'')+'>未分類のみ</option>' +
      state.categories.slice().sort(LN.byOrder).map(function(c){ return '<option value="'+c.id+'"'+(state.printCat===c.id?' selected':'')+'>'+esc(c.name)+'のみ</option>'; }).join('');
    return '<div class="field"><label for="printCat">印刷するメモ</label><select id="printCat">'+catOpts+'</select></div>' +
      '<div class="field"><label for="printMode">印刷方法</label><select id="printMode">' +
        '<option value="mini"'+(s.printMode==='mini'?' selected':'')+'>ミニ用紙にそのまま印刷</option>' +
        '<option value="a4"'+(s.printMode==='a4'?' selected':'')+'>A4に割り付けて印刷(あとで裁断)</option>' +
      '</select></div>' +
      '<div class="section-title">用紙設定(横'+s.paperW+'×縦'+s.paperH+'mm・上端に穴)</div>' +
      '<div class="row">' +
        '<div class="field"><label for="paperW">幅(mm)</label><input type="number" id="paperW" value="'+s.paperW+'" min="30" max="300"></div>' +
        '<div class="field"><label for="paperH">高さ(mm)</label><input type="number" id="paperH" value="'+s.paperH+'" min="30" max="400"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label for="holeMm">上端の穴よけ(mm)</label><input type="number" id="holeMm" value="'+s.holeMm+'" min="0" max="40"></div>' +
        '<div class="field"><label for="marginMm">その他の余白(mm)</label><input type="number" id="marginMm" value="'+s.marginMm+'" min="0" max="20"></div>' +
      '</div>' +
      '<div class="field"><label for="fontPt">文字サイズ(pt)</label><input type="number" id="fontPt" value="'+s.fontPt+'" min="6" max="16" step="0.5"></div>' +
      '<div class="hint" style="margin-bottom:8px;">白黒印刷でも見やすいよう、キー囲みやカテゴリは枠線で表現しています。印刷後に蛍光マーカーで書き込めるよう余白を確保しています。</div>' +
      '<div class="section-title">プレビュー</div>' +
      '<div class="printPreviewWrap" id="printPreviewWrap"><div id="printRoot"></div></div>' +
      '<button class="btn primary block" onclick="App.doPrint()">'+ICONS.print+' 印刷する / PDFで保存</button>' +
      '<div class="hint" style="margin-top:8px;">印刷ダイアログの保存先で「PDFに保存」を選ぶと、印刷せずファイルとして保存できます。長いフローは自動で複数枚に分割されます。</div>';
  }

  function refreshPreview(){
    var built = buildPrintHtml();
    document.getElementById('printRoot').innerHTML = built.html;
    updatePrintPageStyle();
    // scale sheets to fit screen using zoom (mm-absolute children need visual zoom, not just CSS width)
    var wrap = document.getElementById('printPreviewWrap');
    if(!wrap) return;
    var availW = wrap.clientWidth || 320;
    var s = state.settings;
    if(s.printMode==='a4'){
      var scale = Math.min(1, (availW-4) / (210*PX_PER_MM));
      wrap.querySelectorAll('.a4sheet').forEach(function(el){ el.style.zoom = scale; });
    } else {
      var scale2 = Math.min(1, (availW-4) / (s.paperW*PX_PER_MM));
      wrap.querySelectorAll('.printSheet').forEach(function(el){ el.style.zoom = scale2; });
    }
  }

  function wirePrint(){
    refreshPreview();
    document.getElementById('printCat').addEventListener('change', function(){ state.printCat=this.value; refreshPreview(); });
    document.getElementById('printMode').addEventListener('change', function(){ LN.saveSettings({printMode:this.value}).then(function(){ refreshPreview(); }); });
    ['paperW','paperH','holeMm','marginMm','fontPt'].forEach(function(key){
      document.getElementById(key).addEventListener('change', function(){
        var patch={}; patch[key]=Number(this.value)||state.settings[key];
        LN.saveSettings(patch).then(function(){ refreshPreview(); });
      });
    });
  }

  window.App = window.App || {};
  Object.assign(window.App, {
    renderPrint: renderPrint,
    wirePrint: wirePrint,
    doPrint: function(){ updatePrintPageStyle(); setTimeout(function(){ window.print(); }, 60); }
  });
})();
</script>
<script>
(function(){
  "use strict";
  var LN = window.LN, ICONS = LN.ICONS;
  var iconKeys = {list:'list', add:'add', categories:'tag', print:'print', settings:'settings'};
  var tabLabels = {list:'一覧', add:'追加', categories:'カテゴリ', print:'印刷', settings:'設定'};
  document.querySelectorAll('nav.tabbar button').forEach(function(btn){
    var t = btn.dataset.tab;
    btn.innerHTML = ICONS[iconKeys[t]] + '<span>' + tabLabels[t] + '</span>';
  });
  LN.initStorage();
  LN.setupKeyboardAssist();
})();
</script>




<script>
// ---- Service Worker (オフラインで開けるように) ----
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
<script>
(function(){
  "use strict";
  // ---------------------------------------------------------------------------
  // リーフノート : Googleドライブ同期
  //
  // 使うのは drive.file スコープだけ。このアプリが作ったファイル(leafnote-data.json)
  // しか読み書きできないので、ドライブの他の中身には一切触れられない。
  // 認証情報(クライアントID)は利用者自身のものを設定画面で登録してもらう。
  // ---------------------------------------------------------------------------
  var CFG_KEY   = 'leafnote_drive_v1';
  var SCOPE     = 'https://www.googleapis.com/auth/drive.file';
  var FILE_NAME = 'leafnote-data.json';
  var GIS_SRC   = 'https://accounts.google.com/gsi/client';
  var PUSH_DELAY = 5000;          // 編集が止まってからアップロードするまで
  var TOMB_KEEP_DAYS = 180;       // 削除記録を持っておく期間

  var TOK_KEY = 'leafnote_drive_tok_v1';

  function loadCfg(){
    // autoConnect は既定で切ってある。入れておくと、有効期限が切れたあとの起動で
    // Googleの画面が勝手に開くため。切ってあるときは「同期」を押したときだけ開く。
    try{ return Object.assign({clientId:'', fileId:'', lastSync:'', granted:false, autoConnect:false}, JSON.parse(localStorage.getItem(CFG_KEY)||'{}')); }
    catch(e){ return {clientId:'', fileId:'', lastSync:'', granted:false, autoConnect:false}; }
  }
  function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){} }

  // アクセストークンは1時間ほど有効。取っておけば、その間にアプリを開き直しても
  // Googleの画面は出ない。(静的なサイトでは更新トークンは使えないので、これが上限)
  function loadToken(){
    try{
      var t = JSON.parse(localStorage.getItem(TOK_KEY)||'null');
      if(t && t.value && t.exp > Date.now() + 120000) return t;
    }catch(e){}
    return null;
  }
  function saveToken(value, expiresInSec){
    try{ localStorage.setItem(TOK_KEY, JSON.stringify({value:value, exp: Date.now() + (expiresInSec||3600)*1000})); }catch(e){}
  }
  function clearToken(){ try{ localStorage.removeItem(TOK_KEY); }catch(e){} }

  var cfg = loadCfg();
  var saved = loadToken();
  var token = saved ? saved.value : null, tokenExp = saved ? saved.exp : 0;
  var tokenClient = null, pending = [];
  var gisPromise = null, pushTimer = null, syncing = false, dirty = false;
  // 利用者がボタンを押して始めた同期のあいだは、その途中の通信もすべて
  // 「利用者が承知のうえ」として扱う(必要ならGoogleの画面を出してよい)
  var interactiveRun = false;
  var statusText = cfg.clientId ? '未接続' : '未設定';
  var installPrompt = null;

  function LN(){ return window.LN; }
  function ts(v){ if(!v) return 0; var t = Date.parse(v); return isNaN(t) ? 0 : t; }
  function nowIso(){ return new Date().toISOString(); }
  function inEditor(){ var s = LN() && LN().state; return !!s && (s.tab==='flow' || s.tab==='memo'); }

  // ---------- 認証 ----------
  function loadGis(){
    if(gisPromise) return gisPromise;
    gisPromise = new Promise(function(resolve, reject){
      if(window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
      var s = document.createElement('script');
      s.src = GIS_SRC; s.async = true; s.defer = true;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ gisPromise = null; reject(new Error('offline')); };
      document.head.appendChild(s);
    });
    return gisPromise;
  }

  function settle(err, value){
    var list = pending; pending = [];
    list.forEach(function(p){ err ? p.reject(err) : p.resolve(value); });
  }

  // interactive = 利用者がボタンを押した流れかどうか。押していないのに Google の画面を
  // 開くと、起動のたびに認証が挟まって煩わしいので、そのときは黙って見送る。
  function ensureToken(interactive){
    if(!cfg.clientId) return Promise.reject(new Error('no-client-id'));
    if(token && Date.now() < tokenExp - 60000) return Promise.resolve(token);
    if(!interactive && !interactiveRun && !cfg.autoConnect) return Promise.reject(new Error('needs-tap'));
    return loadGis().then(function(){
      return new Promise(function(resolve, reject){
        if(!tokenClient){
          tokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: cfg.clientId,
            scope: SCOPE,
            callback: function(resp){
              if(resp && resp.access_token){
                token = resp.access_token;
                tokenExp = Date.now() + ((resp.expires_in || 3600) * 1000);
                saveToken(token, resp.expires_in);
                if(!cfg.granted){ cfg.granted = true; saveCfg(); }
                settle(null, token);
              } else {
                settle(new Error((resp && resp.error) || 'auth-failed'));
              }
            },
            error_callback: function(err){ settle(new Error((err && err.type) || 'auth-error')); }
          });
        }
        pending.push({resolve:resolve, reject:reject});
        if(pending.length > 1) return;   // すでに要求中
        // 許可済みなら prompt を空にする。こうすると、Googleにログインしたままの端末では
        // 選択画面を出さずに取り直せる。初回だけ同意画面を出す。
        var promptMode = cfg.granted ? '' : 'consent';
        try{ tokenClient.requestAccessToken({prompt: promptMode}); }
        catch(e){ settle(e); }
      });
    });
  }

  // ---------- Drive REST ----------
  function api(url, opts, interactive){
    return ensureToken(!!interactive).then(function(t){
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, {Authorization: 'Bearer ' + t});
      return fetch(url, opts).then(function(r){
        if(r.status === 401){
          token = null; tokenExp = 0; clearToken();
          return ensureToken(!!interactive).then(function(t2){
            opts.headers.Authorization = 'Bearer ' + t2;
            return fetch(url, opts);
          });
        }
        return r;
      });
    }).then(function(r){
      if(!r.ok) throw new Error('drive-' + r.status);
      return r;
    });
  }

  function findFile(interactive){
    if(cfg.fileId) return Promise.resolve(cfg.fileId);
    var q = encodeURIComponent("name='" + FILE_NAME + "' and trashed=false");
    return api('https://www.googleapis.com/drive/v3/files?spaces=drive&pageSize=10&orderBy=modifiedTime desc&q=' + q + '&fields=files(id,modifiedTime)', null, interactive)
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.files && j.files.length){ cfg.fileId = j.files[0].id; saveCfg(); return cfg.fileId; }
        return null;
      });
  }

  function createFile(text){
    var boundary = 'leafnote' + Date.now();
    var meta = {name: FILE_NAME, mimeType: 'application/json', description: 'リーフノートのメモデータ'};
    var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
               JSON.stringify(meta) + '\r\n--' + boundary +
               '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + text + '\r\n--' + boundary + '--';
    return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: {'Content-Type': 'multipart/related; boundary=' + boundary},
      body: body
    }).then(function(r){ return r.json(); })
      .then(function(j){ cfg.fileId = j.id; saveCfg(); return j.id; });
  }

  function downloadRemote(interactive){
    return findFile(interactive).then(function(id){
      if(!id) return null;
      return api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media')
        .then(function(r){ return r.json(); })
        .catch(function(e){
          if(String(e.message).indexOf('404') >= 0){ cfg.fileId = ''; saveCfg(); return null; }
          throw e;
        });
    });
  }

  function uploadPayload(text){
    return findFile(false).then(function(id){
      if(!id) return createFile(text);
      return api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json; charset=UTF-8'},
        body: text
      }).then(function(){ return id; });
    });
  }

  // ---------- データのマージ ----------
  function pruneDeleted(map){
    var cutoff = Date.now() - TOMB_KEEP_DAYS * 86400000, out = {};
    Object.keys(map || {}).forEach(function(k){ if(ts(map[k]) >= cutoff) out[k] = map[k]; });
    return out;
  }

  // メモ・カテゴリは1件ずつ updatedAt の新しいほうを採用する。
  // 削除は deleted に日時が残っていて、その日時が更新日時以降なら消えたまま。
  function mergePayloads(local, remote){
    if(!remote) return local;
    if(!local) return remote;
    var deleted = Object.assign({}, remote.deleted || {});
    var ld = local.deleted || {};
    Object.keys(ld).forEach(function(k){ if(ts(ld[k]) > ts(deleted[k])) deleted[k] = ld[k]; });

    function mergeList(a, b){
      var map = {};
      (a || []).concat(b || []).forEach(function(item){
        if(!item || !item.id) return;
        var cur = map[item.id];
        if(!cur || ts(item.updatedAt) > ts(cur.updatedAt)) map[item.id] = item;
      });
      return Object.keys(map).filter(function(id){
        return !(deleted[id] && ts(deleted[id]) >= ts(map[id].updatedAt));
